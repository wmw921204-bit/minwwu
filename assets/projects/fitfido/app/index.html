<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>Fitfido app prototype</title>
<style>
  :root { --o: #ea5b17; --ink: #333; --muted: #8a8a8a; --sf: -apple-system, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 393px; height: 852px; overflow: hidden; overscroll-behavior: none; background: #efefef; font-family: var(--sf); -webkit-font-smoothing: antialiased; }
  button, input { font-family: inherit; }
  #app { position: relative; width: 393px; height: 852px; overflow: hidden; background: #efefef; touch-action: pan-y; }
  img { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  /* a screen: fixed base, an optional scrolling layer, then fixed layers (nav) on top */
  .scr { position: absolute; inset: 0; overflow: hidden; background: #efefef; pointer-events: none; opacity: 0; transition: transform .34s cubic-bezier(.3,.7,.2,1), opacity .3s ease; }
  .scr.is-cur { pointer-events: auto; opacity: 1; z-index: 2; }
  .scr.is-prev { opacity: 1; z-index: 1; }
  .scr > .base { position: absolute; left: 0; top: 0; width: 393px; }
  .sc { position: absolute; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; scroll-behavior: smooth; }
  .sc::-webkit-scrollbar { display: none; }
  .sc .in { position: relative; }
  .fx { position: absolute; left: 0; width: 393px; pointer-events: none; }
  .fx .hs { pointer-events: auto; }
  .fx .glass { position: absolute; top: 59px; width: 283px; height: 70px; border-radius: 20px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .hs { position: absolute; border: 0; background: transparent; cursor: pointer; border-radius: 14px; -webkit-tap-highlight-color: transparent; }
  .hs:focus-visible { outline: 2px solid var(--o); outline-offset: 2px; }
  .tg { position: absolute; cursor: pointer; }
  .tg img { width: 100%; }
  .layer { position: absolute; pointer-events: none; }
  .patch { position: absolute; display: none; align-items: center; background: #e6e6e6; pointer-events: none; }
  .patch.is-on { display: flex; }
  /* v2 week strip: the selected day */
  .day { position: absolute; top: 342px; width: 39px; height: 79px; border-radius: 20px; background: #ea5b17; color: #fff; text-align: center; pointer-events: none; transition: left .3s cubic-bezier(.3,.7,.2,1); }
  .day b { display: block; margin-top: 12px; font: 400 22px/26px var(--sf); }
  .day i { display: block; margin-top: 12px; font: 400 14px/17px var(--sf); font-style: normal; }
  /* toast */
  .toast { position: absolute; left: 50%; bottom: 118px; z-index: 60; transform: translate(-50%, 16px); opacity: 0; width: max-content; max-width: 340px; padding: 12px 18px; border-radius: 16px; background: rgba(28,28,28,.92); color: #fff; font-size: 14px; line-height: 1.35; text-align: center; transition: .3s; pointer-events: none; }
  .toast.is-on { transform: translate(-50%, 0); opacity: 1; }

  /* ---------- v1 Feeding Mode card, rebuilt so every control works ---------- */
  .fm { position: absolute; left: 18px; top: 244px; width: 360px; height: 309px; border-radius: 10px; background: #e8e8e8; box-shadow: 5px 5px 20px rgba(185,185,185,.5), -5px -5px 20px #fff; font-family: var(--sf); }
  .fm * { position: absolute; }
  .fm .t { font-weight: 700; font-size: 16px; line-height: 19px; white-space: nowrap; transition: color .25s; }
  .fm .well { border-radius: 10px; background: #e8e8e8; box-shadow: inset -5px -5px 4px rgba(255,255,255,.3), inset 5px 5px 4px rgba(174,174,192,.2); }
  .fm .ic { width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; transition: background .25s; }
  .fm .ic svg { position: static; }
  .fm .sw { width: 46px; height: 22px; cursor: pointer; }
  .fm .sw .tr { left: 1px; top: 3px; width: 44px; height: 16px; border-radius: 50px; background: #d4d4d4; box-shadow: inset 2.5px 2.5px 5px rgba(87,87,87,.55), inset -2.5px -2.5px 5px rgba(250,251,255,.1); transition: background .25s; }
  .fm .sw .kn { left: 1px; top: 1px; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #f4f6f9, #dfe3e8); box-shadow: 2.5px 2.5px 8px rgba(53,62,85,.35), -2.5px -2.5px 8px #fff; transition: left .25s cubic-bezier(.3,.7,.2,1); }
  .fm .sw.on .tr { background: #e95a18; }
  .fm .sw.on .kn { left: 25px; }
  .fm .seg { border-radius: 50px; transition: opacity .25s; }
  .fm .seg button { position: absolute; top: 0; height: 50px; border: 0; background: none; cursor: pointer; font-weight: 500; font-size: 11px; color: #b1b1b1; transition: color .25s; }
  .fm .thumb { top: 5px; width: 99px; height: 42px; border-radius: 20px; background: #e8e8e8; box-shadow: 5px 5px 10px rgba(193,193,193,.35), -5px -5px 5px rgba(255,255,255,.6), inset 2px 2px 4px #fff, inset -2px -2px 4px rgba(0,0,0,.1); transition: left .3s cubic-bezier(.3,.7,.2,1); pointer-events: none; }
  .fm .msg { border-radius: 6px; transition: background .25s; }
  .fm .msg b { left: 20px; top: 4px; font-weight: 500; font-size: 11px; line-height: 13px; white-space: nowrap; }
  .fm .msg svg { left: 7px; top: 5px; }
  .fm .msg span { left: 23px; top: 17px; width: 286px; font: 400 10px/12px Inter, var(--sf); color: #333; }
  .fm.manual .auto-t { color: #b1b1b1 !important; }
  .fm.manual .seg { opacity: .45; pointer-events: none; }
  .badge { position: absolute; left: 172px; top: 99px; width: 118px; height: 28px; background: #e6e6e6; pointer-events: none; display: none; }
  .badge span { position: absolute; left: 4px; top: 3px; height: 22px; padding: 0 9px 0 22px; border-radius: 6px; background: #dedede; color: #8a8a8a; font-size: 12px; font-weight: 500; line-height: 22px; }
  .badge span::before { content: ""; position: absolute; left: 9px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.is-on { display: block; }

  /* ---------- pages drawn in each version's style ---------- */
  .pg { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .pg::-webkit-scrollbar { display: none; }
  .sbar { height: 50px; background: url(s/v1-food.webp?v=2) 0 0 / 393px auto no-repeat; }
  .v1 .pg { background: #e6e6e6; padding: 0 22px 40px; }
  .v1 .pg .sbar { margin: 0 -22px; }
  .p1-head { position: relative; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #333; }
  .p1-back { position: absolute; left: 0; top: 8px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #e8e8e8; box-shadow: 4px 4px 10px rgba(174,174,192,.45), -4px -4px 10px #fff; color: #9a9a9a; font-size: 20px; cursor: pointer; }
  .nm { background: #e8e8e8; border-radius: 14px; box-shadow: 5px 5px 16px rgba(185,185,185,.5), -5px -5px 16px #fff; }
  .nm-in { background: #e8e8e8; border-radius: 12px; box-shadow: inset -4px -4px 6px rgba(255,255,255,.6), inset 4px 4px 6px rgba(174,174,192,.25); }
  .p1-big { margin-top: 18px; padding: 20px; }
  .p1-big small { color: #333; font-size: 14px; font-weight: 600; }
  .p1-big b { display: block; margin-top: 6px; color: var(--o); font-size: 44px; font-weight: 700; letter-spacing: -.01em; }
  .p1-big b em { font-style: normal; font-size: 16px; color: #333; margin-left: 4px; }
  .p1-big p { margin-top: 4px; font-size: 13px; color: #2f9e57; }
  .p1-chart { margin-top: 18px; padding: 18px 14px 10px; }
  .p1-chart svg { display: block; width: 100%; }
  .p1-h { margin: 22px 0 10px; font-size: 18px; font-weight: 700; color: var(--o); }
  .p1-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 12px; font-size: 14px; color: #333; cursor: pointer; border: 0; width: 100%; text-align: left; }
  .p1-row i { flex: none; width: 34px; height: 34px; border-radius: 10px; background: #f6dccb; display: grid; place-items: center; font-style: normal; font-size: 16px; }
  .p1-row span { flex: 1; } .p1-row span small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .p1-row em { font-style: normal; color: var(--o); font-weight: 700; }
  .v1 .btn1 { display: block; width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 14px; background: var(--o); color: #fff; font-size: 17px; font-weight: 600; box-shadow: 4px 6px 14px rgba(234,91,23,.35); cursor: pointer; }

  .v2 .pg { background: #efefef; padding: 59px 20px 40px; }
  .p2-back { width: 52px; height: 52px; border-radius: 50%; border: 0; background: #fff; font-size: 22px; color: #222; cursor: pointer; }
  .p2-title { margin: 30px 0 22px; font-size: 34px; font-weight: 300; color: #222; letter-spacing: -.01em; }
  .p2-card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; margin-bottom: 12px; border: 0; border-radius: 22px; background: #fff; text-align: left; cursor: pointer; font-size: 15px; color: #222; }
  .p2-card i { flex: none; width: 44px; height: 44px; border-radius: 50%; background: #f3f3f3; display: grid; place-items: center; font-style: normal; font-size: 19px; }
  .p2-card span { flex: 1; } .p2-card span small { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
  .p2-card em { font-style: normal; font-size: 12px; color: var(--muted); align-self: flex-start; }
  .tr-head { display: flex; align-items: center; gap: 14px; }
  .tr-head i { flex: none; width: 56px; height: 56px; border-radius: 50%; background: #f3f3f3; display: grid; place-items: center; font-style: normal; font-size: 26px; }
  .p2-sub { font-size: 14px; color: var(--muted); }
  .p2-sum { margin-top: 20px; padding: 20px; border-radius: 24px; background: #fff; }
  .p2-sum div { display: flex; align-items: baseline; gap: 8px; }
  .p2-sum b { font-size: 44px; font-weight: 300; color: #ea5b17; letter-spacing: -.02em; }
  .p2-sum span { font-size: 15px; color: var(--muted); }
  .p2-sum i { display: block; height: 10px; margin-top: 12px; border-radius: 5px; background: #f1f1f1; overflow: hidden; }
  .p2-sum u { display: block; height: 100%; border-radius: 5px; background: #ea5b17; transition: width .6s; }
  .p2-sum p { margin-top: 10px; font-size: 14px; color: #222; }
  .p2-h { margin: 24px 0 10px; font-size: 18px; font-weight: 500; color: #222; }
  .p2-card em.kc { align-self: center; font-size: 15px; color: #ea5b17; font-weight: 500; }
  .p2-card.is-later { opacity: .55; cursor: default; }
  .p2-cta { display: block; width: 100%; margin-top: 18px; padding: 17px; border: 0; border-radius: 99px; background: #ea5b17; color: #fff; font-size: 17px; font-weight: 500; cursor: pointer; }
  .p2-card.new i::after { content: ""; position: absolute; }

  /* ---------- sheets ---------- */
  .veil { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.32); opacity: 0; transition: opacity .3s; }
  .veil.is-on { opacity: 1; }
  .sheet { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 31; max-height: 760px; overflow-y: auto; scrollbar-width: none; padding: 24px 20px 20px; border-radius: 30px; transform: translateY(110%); transition: transform .42s cubic-bezier(.3,.7,.2,1); }
  .sheet::-webkit-scrollbar { display: none; }
  .sheet.is-on { transform: none; }
  .sheet.dialog { top: 50%; bottom: auto; left: 36px; right: 36px; transform: translateY(-40%) scale(.94); opacity: 0; transition: .3s; text-align: center; }
  .sheet.dialog.is-on { transform: translateY(-50%); opacity: 1; }
  .btn { display: block; width: 100%; margin-top: 18px; padding: 15px; border: 0; border-radius: 16px; background: var(--o); color: #fff; font-size: 17px; font-weight: 600; line-height: 1; cursor: pointer; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn--ghost { background: transparent; color: var(--muted); margin-top: 6px; font-weight: 500; font-size: 15px; box-shadow: none !important; }
  .v1 .sheet { background: #ececec; box-shadow: 8px 8px 24px rgba(0,0,0,.18), -6px -6px 16px rgba(255,255,255,.8); }
  .v1 .sheet h3 { font-size: 20px; color: var(--o); }
  .v1 .sheet p { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.4; }
  .v1 .btn { box-shadow: 4px 6px 14px rgba(234,91,23,.35); }
  .v1 .field { margin-top: 18px; width: 100%; padding: 15px 16px; border: 0; border-radius: 12px; background: #e8e8e8; box-shadow: inset -4px -4px 6px rgba(255,255,255,.7), inset 4px 4px 6px rgba(174,174,192,.3); font-size: 17px; color: #333; outline: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .chip { padding: 11px 18px; border: 0; border-radius: 99px; font-size: 15px; cursor: pointer; }
  .v1 .chip { background: #e8e8e8; color: #8a8a8a; box-shadow: 4px 4px 10px rgba(174,174,192,.4), -4px -4px 10px #fff; }
  .v1 .chip.on { color: var(--o); box-shadow: inset 3px 3px 6px rgba(174,174,192,.4), inset -3px -3px 6px #fff; }
  .dial { position: relative; width: 190px; height: 190px; margin: 20px auto 6px; border-radius: 50%; background: #ececec; box-shadow: inset 6px 6px 14px rgba(0,0,0,.12), inset -6px -6px 14px rgba(255,255,255,.9); display: grid; place-items: center; text-align: center; }
  .dial b { display: block; font-size: 46px; color: var(--o); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .dial small { font-size: 14px; color: var(--muted); }
  .dial i { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; transition: color .3s; }
  .dial.is-stable i { color: #2f9e57; }
  .dial svg { position: absolute; inset: 8px; width: 174px; height: 174px; }
  .portion { display: flex; align-items: baseline; justify-content: center; gap: 12px; margin: 22px 0 4px; font-size: 18px; color: var(--muted); }
  .portion b { font-size: 40px; color: var(--o); }
  .portion s { color: #b5b5b5; }

  .v2 .sheet { background: #fff; box-shadow: 0 -10px 40px rgba(0,0,0,.12); }
  .v2 .sheet h3 { font-size: 24px; font-weight: 400; color: #222; }
  .v2 .sheet p { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.45; }
  .v2 .field { margin-top: 16px; width: 100%; padding: 15px 16px; border: 0; border-radius: 16px; background: #f3f3f3; font-size: 16px; color: #222; outline: none; }
  .v2 .chip { background: #f3f3f3; color: #444; }
  .v2 .chip.on { background: #ea5b17; color: #fff; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px; border-radius: 18px; background: #f3f3f3; font-size: 15px; color: #222; }
  .row i { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-style: normal; font-size: 18px; }
  .row span { flex: 1; } .row span small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
  .row em { font-style: normal; font-size: 13px; color: #34a853; }
  .row em.wait { color: var(--muted); }
  .row.tap { cursor: pointer; border: 0; width: 100%; text-align: left; }
  .spin { width: 16px; height: 16px; border: 2px solid #ccc; border-top-color: var(--o); border-radius: 50%; animation: s 1s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .step { display: flex; align-items: center; gap: 10px; }
  .step button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #fff; font-size: 18px; color: #222; cursor: pointer; }
  .v1 .step button { background: #e8e8e8; box-shadow: 3px 3px 8px rgba(174,174,192,.45), -3px -3px 8px #fff; color: var(--o); }
  .step b { min-width: 56px; text-align: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sum { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: #fdf0e9; font-size: 14px; color: #555; }
  .sum b { font-size: 20px; color: var(--o); }
  .sw2 { position: relative; flex: none; width: 50px; height: 30px; border-radius: 99px; background: #ddd; border: 0; cursor: pointer; transition: background .25s; }
  .sw2::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: left .25s; }
  .sw2.on { background: #ea5b17; } .sw2.on::after { left: 23px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; text-align: center; font-size: 15px; }
  .cal span { padding: 4px 0 8px; font-size: 12px; color: var(--muted); }
  .cal button { height: 40px; border: 0; border-radius: 50%; background: none; font-size: 15px; color: #222; cursor: pointer; }
  .cal button.on { background: #ea5b17; color: #fff; }
  .cal button.muted { color: #c4c4c4; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .slots .chip { padding: 11px 0; text-align: center; }
  .lbl { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .bub { max-width: 80%; margin-top: 10px; padding: 11px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
  .bub.them { background: #f3f3f3; color: #222; border-bottom-left-radius: 6px; }
  .bub.me { margin-left: auto; background: #ea5b17; color: #fff; border-bottom-right-radius: 6px; }
  .bcs { display: flex; gap: 4px; margin-top: 18px; }
  .bcs i { flex: 1; height: 10px; border-radius: 5px; background: #eee; }
  .bcs i.ok { background: #ffd2ba; } .bcs i.me { background: #ea5b17; }
  .bcs-l { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .dialog h3 { font-size: 20px !important; }
  .dialog .two { display: flex; gap: 10px; margin-top: 20px; }
  .dialog .two .btn { margin: 0; }
  .dialog .two .btn--ghost { background: #f3f3f3; color: #222; }
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* Fitfido prototypes, wired as in the Figma prototype plus the links a real app would need.
   ?mode=before is the first app, ?mode=after the second. Screens are layered Figma exports (fixed base,
   scrolling layer, fixed nav) in the screen's own points (393 x 852); hotspots on a scrolling layer use
   that layer's coordinates. Screens and sheets the designs didn't have are drawn here in each version's
   style. Every screen and sheet carries data-testid so the case-study page can explain where you are. */
const MODE = new URLSearchParams(location.search).get("mode") === "before" ? "before" : "after";
const PRE = MODE === "before" ? "b-" : "a-";
const app = document.getElementById("app");
app.className = MODE === "before" ? "v1" : "v2";
const S = (n) => "s/" + n + ".webp?v=3";
const state = { portion: 245, auto: true, mode: "ai", manual: false, day: 29, pieces: 1, booked: true,
  pet: "Mercy", fromRow: false, log: [["🍽️", "Breakfast", "Feeder · 160 g", "7:30 AM", 620, "feeder"], ["🍽️", "Lunch", "Feeder · 130 g", "12:30 PM", 505, "feeder"], ["🍪", "Peanut butter biscuit", "Logged by Agnes", "3:10 PM", 280, ""], ["🥩", "Dried Beef", "Photo · 1 piece", "4:45 PM", 45, "plan"]],
  dog: { name: "Jelly", gender: "Female", age: "3yrs 2mon", breed: "Corgi", wifi: "Jellyjellyje" } };

/* ---------- screens ---------- */
const NAV1 = [{ x: 21, y: 774, w: 117, h: 56, tab: "home" }, { x: 138, y: 774, w: 117, h: 56, tab: "feeder" }, { x: 255, y: 774, w: 116, h: 56, tab: "settings" }];
const NAV2 = [{ x: 63, y: 765, w: 62, h: 58, tab: "home1" }, { x: 131, y: 765, w: 62, h: 58, tab: "device1" }, { x: 199, y: 765, w: 62, h: 58, tab: "appt" }, { x: 267, y: 765, w: 62, h: 58, tab: "profile" }];
const nav2 = (img) => ({ img: S("v2-nav-" + img), y: 700, h: 152, hs: NAV2 });
// Home (v2): avatars, header icons and cards live in the scrolling layer (offset 13, 59)
const DAYS = [[25, "mon", 40], [26, "tue", 89.5], [27, "wed", 137.5], [28, "thu", 185], [29, "fri", 233.5], [30, "sat", 282.5], [31, "sun", 330.5]];
const homeHs = (pets) => [...pets,
  { x: 240, y: 0, w: 50, h: 48, go: "notif" }, { x: 302, y: 0, w: 56, h: 48, tab: "profile" },
  { x: 312, y: 266, w: 40, h: 40, act: "calendar" },
  ...DAYS.map(([d, , c]) => ({ x: c - 22, y: 342, w: 44, h: 79, act: "pickDay", d })),
  { x: 246, y: 462, w: 116, h: 32, tab: "appt" },
  { x: 36, y: 655, w: 152, h: 100, act: "bcs" }, { x: 196, y: 655, w: 160, h: 100, go: "calories" },
  { x: 170, y: 784, w: 48, h: 40, act: "scrollDown" }];

/* ---------- building ---------- */
const els = {};
let dragged = false;
const btn = (h, onClick) => {
  const b = document.createElement("button");
  b.className = "hs"; b.style.cssText = `left:${h.x}px;top:${h.y}px;width:${h.w}px;height:${h.h}px`;
  b.setAttribute("aria-label", h.go || h.tab || h.swap || h.swipeTo || h.act || "back");
  b.addEventListener("click", (e) => { e.stopPropagation(); if (!dragged) onClick(h); });
  return b;
};
const bindPage = (root) => root.querySelectorAll("[data-back],[data-go],[data-tab],[data-act]").forEach((b) => b.addEventListener("click", (e) => {
  e.stopPropagation(); const d = b.dataset;
  if ("back" in d) act({ back: 1 }); else if (d.go) act({ go: d.go }); else if (d.tab) act({ tab: d.tab }); else act({ act: d.act });
}));
const renderPage = (el, s) => {
  el.innerHTML = PAGES[s.html](); bindPage(el);
  el.querySelectorAll("[data-row]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); actions.treat(+b.dataset.row); }));
};
const make = (id) => {
  if (els[id]) return els[id];
  const s = SCREENS[id], el = document.createElement("div");
  el.className = "scr"; el.dataset.testid = PRE + id;
  if (s.html) renderPage(el, s);
  if (s.base) el.insertAdjacentHTML("beforeend", `<img class="base" src="${s.base}" alt="">`);
  if (s.ring) el.insertAdjacentHTML("beforeend", `<svg class="layer" style="left:45px;top:140px;width:143px;height:143px" viewBox="0 0 143 143"><circle id="ring" cx="71.5" cy="71.5" r="71" fill="none" stroke="#f4f4f4" stroke-width="2.6" stroke-linecap="round" transform="rotate(-90 71.5 71.5)" pathLength="100" stroke-dasharray="0 100"/></svg>`);
  if (s.patch === "portion") el.insertAdjacentHTML("beforeend", `<div class="patch" id="portion" style="left:46px;top:549px;width:86px;height:36px"><b style="font-size:24px;font-weight:700;color:#ea5b17">230</b><small style="font-size:13px;color:#ea5b17;margin-left:1px">/270</small><small style="font-size:13px;color:#333">g</small></div>`);
  if (s.patch === "dog") Object.entries({ name: 301, gender: 366, age: 431, breed: 496, wifi: 633 }).forEach(([k, y]) => el.insertAdjacentHTML("beforeend", `<div class="patch" data-f="${k}" style="right:70px;top:${y - 12}px;height:24px;min-width:120px;justify-content:flex-end;font-size:15px;font-weight:500;color:#b9b9b9"></div>`));
  if (s.scan) el.insertAdjacentHTML("beforeend", `<img class="layer" id="scan" src="${S("v2-scan0")}" style="left:0;top:134px;width:393px" alt="">`);
  (s.hs || []).forEach((h) => el.append(btn(h, act)));
  if (s.feeding) buildFeeding(el);
  if (s.sc) {
    const sc = document.createElement("div"), inn = document.createElement("div");
    sc.className = "sc"; sc.style.cssText = `left:${s.sc.x}px;top:${s.sc.y}px;width:${s.sc.w}px;height:${s.sc.h}px`;
    inn.className = "in"; inn.style.height = s.sc.ch + "px";
    inn.insertAdjacentHTML("beforeend", `<img src="${s.sc.img}" style="width:${s.sc.w}px" alt="">`);
    if (s.strip) inn.insertAdjacentHTML("beforeend", `<div class="day"><b></b><i></i></div>`);
    (s.sc.hs || []).forEach((h) => inn.append(btn(h, act)));
    (s.sc.tg || []).forEach((t) => {
      const d = document.createElement("div"); d.className = "tg"; d.style.cssText = `left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px`;
      const im = document.createElement("img"); im.src = S(TOGGLES[t.a][t.on]); im.alt = ""; d.append(im);
      d.addEventListener("click", (e) => { e.stopPropagation(); if (dragged) return; t.on = 1 - t.on; im.src = S(TOGGLES[t.a][t.on]); });
      inn.append(d);
    });
    sc.append(inn); el.append(sc);
    sc.addEventListener("scroll", () => { el.toggleAttribute("data-scrolled", sc.scrollTop > 60); }, { passive: true });
  }
  if (s.fx) {
    const fx = document.createElement("div"); fx.className = "fx"; fx.style.cssText = `top:${s.fx.y}px;height:${s.fx.h}px`;
    fx.insertAdjacentHTML("beforeend", `<div class="glass" style="left:${s.fx.img.includes("det") ? 59 : 55}px"></div><img src="${s.fx.img}" style="position:relative;width:393px" alt="">`);
    s.fx.hs.forEach((h) => fx.append(btn({ ...h, y: h.y - s.fx.y }, act)));
    el.append(fx);
  }
  app.append(el); els[id] = el; return el;
};

  const sc = next.querySelector(".sc,.pg"); if (sc && how !== "swap") { sc.style.scrollBehavior = "auto"; sc.scrollTop = 0; sc.style.scrollBehavior = ""; }

      ${[["Mercy", "Today 9:32 PM", "74 lbs"], ["Hoppy", "Today 7:50 PM", "81 lbs"], ["Hoppy", "Yesterday 7:21 PM", "80 lbs"], ["Kitty", "Yesterday 8:05 AM", "52 lbs"], ["Mercy", "Tue 9:10 PM", "74.5 lbs"]].map(([n, t, w]) => `<div class="row"><span>${n}<small>${t}</small></span><em style="color:#ea5b17">${w}</em></div>`).join("")}
      <button class="btn" data-close>Done</button>`, "history"),
  pickOther: () => toast("Pick the photo of the treat"),
  portion: () => sheet(`<h3>How much did Mercy eat?</h3><p>Dried Beef · 45 kcal per piece (10 g)</p>
      <div class="row"><span>Pieces</span><div class="step" data-v="${state.pieces}"><button>−</button><b>${state.pieces}</b><button>+</button></div></div>
      <div class="sum"><span>Tonight’s dinner</span><b id="din">${150 - 15 * state.pieces} g</b></div>
      <button class="btn" id="s">Update</button>`, "portion", (sh, close) => {
      stepper(sh, ".step", 1, 1, 5, () => { sh.querySelector("#din").textContent = (150 - 15 * +sh.querySelector(".step").dataset.v) + " g"; });
      sh.querySelector("#s").onclick = () => { state.pieces = +sh.querySelector(".step").dataset.v; close(); toast(`${state.pieces} piece${state.pieces > 1 ? "s" : ""}: ${45 * state.pieces} kcal, dinner ${150 - 15 * state.pieces} g`); }; }),
  discard: () => { leaveCamera(); toast("Not logged"); },
  feedAndLog: () => {
    if (state.fromRow) { leaveCamera(); toast("Already logged at 4:45 PM"); return; }
    state.log.push(["🥩", "Dried Beef", `Photo · ${state.pieces} piece${state.pieces > 1 ? "s" : ""}`, "Just now", 45 * state.pieces, "plan"]);
    leaveCamera(); toast(`Logged ${45 * state.pieces} kcal. Tonight’s dinner is ${150 - 15 * state.pieces} g; the feeder is updated.`); state.pieces = 1;
  },
  reschedule: () => sheet(`<h3>Reschedule</h3><p>Dr. Aris Ray · in clinic</p>
      <p class="lbl">Day</p><div class="chips">${["Feb 3", "Feb 4", "Feb 5", "Feb 6"].map((d, i) => `<button class="chip ${i === 0 ? "on" : ""}">${d}</button>`).join("")}</div>
      <p class="lbl">Time</p><div class="slots">${["9:00 AM", "11:30 AM", "2:00 PM", "4:30 PM", "5:15 PM", "6:00 PM"].map((t, i) => `<button class="chip ${i === 3 ? "on" : ""}">${t}</button>`).join("")}</div>
      <button class="btn" id="s">Confirm</button><button class="btn btn--ghost" data-close>Keep current time</button>`, "reschedule", (sh, close) => {
      sh.querySelector("#s").onclick = () => { const d = sh.querySelector(".chips .on").textContent, t = sh.querySelector(".slots .on").textContent; close(); toast(`Moved to ${d}, ${t}`); }; }),
  message: () => sheet(`<h3>Dr. Aris Ray</h3><p>Usually replies within an hour.</p>
      <div class="bub them">Hi Ally! Mercy’s weight trend looks good. Keep treats under 10% of her daily calories.</div><div id="th"></div>
      <input class="field" id="m" value="Is dried beef okay as a treat?"><button class="btn" id="s">Send</button>`, "message", (sh) => {
      sh.querySelector("#s").onclick = () => { const v = sh.querySelector("#m").value.trim(); if (!v) return; sh.querySelector("#th").insertAdjacentHTML("beforeend", `<div class="bub me">${v.replace(/</g, "&lt;")}</div>`); sh.querySelector("#m").value = "";
        setTimeout(() => sh.isConnected && sh.querySelector("#th").insertAdjacentHTML("beforeend", `<div class="bub them">Yes, in small pieces. Fitfido already takes it off her dinner.</div>`), 900); }; }),
  book: (h) => sheet(`<h3>${h.kind === "video" ? "Book a video visit" : "Book a clinic visit"}</h3><p>${h.kind === "video" ? "150+ certified vets online" : "45+ clinics in Georgia"} · for Mercy</p>
      <p class="lbl">Vet</p><div class="chips">${["Dr. Aris Ray", "Dr. Lena Cho", "Any vet"].map((d, i) => `<button class="chip ${i === 0 ? "on" : ""}">${d}</button>`).join("")}</div>
      <p class="lbl">Day</p><div class="chips">${["Feb 3", "Feb 4", "Feb 5"].map((d, i) => `<button class="chip ${i === 0 ? "on" : ""}">${d}</button>`).join("")}</div>
      <p class="lbl">Time</p><div class="slots">${["9:00 AM", "11:30 AM", "4:30 PM"].map((t, i) => `<button class="chip ${i === 2 ? "on" : ""}">${t}</button>`).join("")}</div>
      <button class="btn" id="s">Book</button><button class="btn btn--ghost" data-close>Cancel</button>`, "book", (sh, close) => {
      sh.querySelector("#s").onclick = () => { const p = [...sh.querySelectorAll(".chips .on, .slots .on")].map((x) => x.textContent); close(); state.booked = true; stack = []; show("appt", cur === "apptNone" ? "swap" : "fade"); toast(`Booked: ${p[0]}, ${p[1]} at ${p[2]}`); }; }),
  cancelAppt: () => { state.booked = false; show("apptNone", "swap"); toast("Appointment cancelled"); },
  qa: () => sheet(`<h3>Quick Q&amp;A</h3><p>A vet answers in about 5 minutes.</p>
      <div class="chips">${["Is Mercy’s weight healthy?", "How many treats a day?", "Why is Hoppy eating less?"].map((q) => `<button class="chip">${q}</button>`).join("")}</div><div id="th"></div>`, "qa", (sh) => {
      sh.querySelector(".chips").addEventListener("pick", () => { const q = sh.querySelector(".chips .on").textContent; sh.querySelector("#th").innerHTML = `<div class="bub me">${q}</div><div class="bub them"><span class="spin"></span>A vet is typing…</div>`;
        setTimeout(() => { if (sh.isConnected) sh.querySelector("#th").lastElementChild.textContent = "Keep treats under 10% of daily calories. Fitfido counts them for you when you snap a photo."; }, 1400); }); }),
  emergency: () => sheet(`<h3>Emergency</h3><p>A vet picks up in about 15 seconds, any time.</p>
      <div class="row"><i>☎️</i><span>24/7 Vet Line<small>(912) 555-0144</small></span></div>
      <div class="row"><i>📍</i><span>Nearest emergency clinic<small>Savannah Animal ER · 2.1 mi</small></span></div>
      <button class="btn" id="c">Call now</button><button class="btn btn--ghost" data-close>Close</button>`, "emergency", (sh, close) => { sh.querySelector("#c").onclick = () => { close(); toast("Calling the 24/7 Vet Line…"); }; }),
  search: () => sheet(`<h3>Find a doctor</h3><input class="field" placeholder="Search by name or need" value="weight">
      <div class="chips">${["Obesity", "Senior dogs", "Nutrition", "Video visit"].map((c, i) => `<button class="chip ${i === 0 ? "on" : ""}">${c}</button>`).join("")}</div>
      ${[["Dr. Aris Ray", "Obesity intervention · 4.9 ★"], ["Dr. Lena Cho", "Nutrition · 4.8 ★"], ["Dr. Omar Hale", "Senior dogs · 4.7 ★"]].map(([n, s]) => `<button class="row tap" data-k="clinic"><i>🩺</i><span>${n}<small>${s}</small></span></button>`).join("")}`, "search", (sh) => {
      sh.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => actions.book({ kind: "clinic" }))); }),
  menu: () => sheet(`<h3>Menu</h3>${[["🏠", "Home", "home1"], ["🍽️", "Devices", "device1"], ["🩺", "Health Care", "appt"]].map(([i, n, t]) => `<button class="row tap" data-t="${t}"><i>${i}</i><span>${n}</span></button>`).join("")}<button class="btn btn--ghost" data-close>Close</button>`, "menu", (sh, close) => {
      sh.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => { close(); act({ tab: b.dataset.t }); })); }),
  addPet: () => sheet(`<h3>Add a pet</h3><input class="field" placeholder="Name" value="Kitty"><div class="chips">${["Dog", "Cat"].map((c, i) => `<button class="chip ${i === 0 ? "on" : ""}">${c}</button>`).join("")}</div>
      <button class="btn" id="s">Add</button><button class="btn btn--ghost" data-close>Cancel</button>`, "addpet", (sh, close) => { sh.querySelector("#s").onclick = () => { close(); toast(`${sh.querySelector("input").value || "Pet"} added. Weigh them once to start a plan.`); }; }),
  member: (h) => sheet(`<h3>${h.who === "Family" ? "Shared members" : h.who}</h3><p>${h.who === "Family" ? "What family members can do." : "What " + h.who + " can do."}</p>
      ${[["See health data", 1], ["Feed and log treats", 1], ["Change feeding plans", h.who === "Samuel"]].map(([t, on]) => `<div class="row"><span>${t}</span><button class="sw2 ${on ? "on" : ""}" aria-label="${t}"></button></div>`).join("")}
      <button class="btn" id="s">Save</button>`, "member", (sh, close) => { sh.querySelector("#s").onclick = () => { close(); toast("Permissions saved"); }; }),
  invite: () => sheet(`<h3>Invite a family member</h3><p>They can feed and log treats for your pets.</p><input class="field" placeholder="Email" value="sam@example.com">
      <button class="btn" id="s">Send invite</button><button class="btn btn--ghost" data-close>Cancel</button>`, "invite", (sh, close) => { sh.querySelector("#s").onclick = () => { close(); toast("Invite sent"); }; }),
  location: () => sheet(`<h3>Location Based Service</h3><p>Used to find nearby clinics and emergency care.</p>
      <div class="row"><span>Use my location<small>Savannah, GA</small></span><button class="sw2 on" aria-label="Use my location"></button></div><button class="btn" data-close>Done</button>`, "location"),
  privacy: () => sheet(`<h3>Notification &amp; Privacy</h3>
      ${[["Feeding reminders", 1], ["Weight updates", 1], ["Vet messages", 1], ["Share data with my vet", 1], ["Product news", 0]].map(([t, on]) => `<div class="row"><span>${t}</span><button class="sw2 ${on ? "on" : ""}" aria-label="${t}"></button></div>`).join("")}
      <button class="btn" data-close>Done</button>`, "privacy"),
  logout: () => sheet(`<h3>Log out?</h3><p>Your feeders keep running. Log back in any time.</p><div class="two"><button class="btn btn--ghost" data-close>Cancel</button><button class="btn" id="s">Log out</button></div>`, "logout", (sh, close) => {
      sh.querySelector("#s").onclick = () => { close(); stack = []; show("onboarding"); }; }, "dialog"),
};

// the case-study page can restart the prototype
addEventListener("message", (e) => { if (e.data && e.data.type === "fitfido-restart") { stack = []; show(START); } });
show(START);
</script>
</body>
</html>
