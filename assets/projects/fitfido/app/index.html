<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>Fitfido app prototype</title>
<style>
  :root { --o: #f0611f; --ink: #1f1f1f; --muted: #7b7b7b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 393px; height: 852px; overflow: hidden; overscroll-behavior: none; background: #efefef; font-family: -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #app { position: relative; width: 393px; height: 852px; overflow: hidden; background: #efefef; touch-action: pan-y; }
  img { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  /* a screen: fixed base, an optional scrolling layer, then fixed layers (nav) on top */
  .scr { position: absolute; inset: 0; overflow: hidden; background: #efefef; pointer-events: none; opacity: 0; transition: transform .34s cubic-bezier(.3,.7,.2,1), opacity .3s ease; }
  .scr.is-cur { pointer-events: auto; opacity: 1; z-index: 2; }
  .scr.is-prev { opacity: 1; z-index: 1; }
  .scr > .base { position: absolute; left: 0; top: 0; width: 393px; }
  .sc { position: absolute; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .sc::-webkit-scrollbar { display: none; }
  .sc .in { position: relative; }
  .fx { position: absolute; left: 0; width: 393px; pointer-events: none; }
  .fx .hs { pointer-events: auto; }
  .fx .glass { position: absolute; top: 59px; width: 283px; height: 70px; border-radius: 20px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .hs { position: absolute; border: 0; background: transparent; cursor: pointer; border-radius: 14px; -webkit-tap-highlight-color: transparent; }
  .hs:focus-visible { outline: 3px solid var(--o); outline-offset: 2px; }
  .tg { position: absolute; cursor: pointer; }
  .tg img { width: 100%; }
  #app.is-hint .scr.is-cur .hs, #app.is-hint .scr.is-cur .tg { animation: hint .7s ease-out; }
  @keyframes hint { 35% { box-shadow: 0 0 0 3px rgba(240,97,31,.6); background: rgba(240,97,31,.1); } }
  .layer { position: absolute; pointer-events: none; }
  /* toast */
  .toast { position: absolute; left: 50%; bottom: 118px; z-index: 40; transform: translate(-50%, 16px); opacity: 0; max-width: 340px; padding: 12px 18px; border-radius: 16px; background: rgba(28,28,28,.92); color: #fff; font-size: 14px; line-height: 1.35; text-align: center; transition: .3s; pointer-events: none; }
  .toast.is-on { transform: translate(-50%, 0); opacity: 1; }
  /* sheets drawn in each version's style */
  .veil { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.3); opacity: 0; transition: opacity .3s; }
  .veil.is-on { opacity: 1; }
  .sheet { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 31; padding: 26px 22px 22px; border-radius: 30px; transform: translateY(110%); transition: transform .42s cubic-bezier(.3,.7,.2,1); }
  .sheet.is-on { transform: none; }
  .btn { display: block; width: 100%; margin-top: 18px; padding: 15px; border: 0; border-radius: 16px; background: var(--o); color: #fff; font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1; cursor: pointer; }
  .btn--ghost { background: transparent; color: var(--muted); margin-top: 6px; font-weight: 500; font-size: 15px; box-shadow: none !important; }
  .v1 .sheet { background: #ececec; box-shadow: 8px 8px 24px rgba(0,0,0,.18), -6px -6px 16px rgba(255,255,255,.8); }
  .v1 .sheet h3 { font-size: 20px; color: var(--o); }
  .v1 .sheet p { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .v1 .btn { box-shadow: 4px 6px 14px rgba(240,97,31,.35); }
  .dial { position: relative; width: 190px; height: 190px; margin: 20px auto 6px; border-radius: 50%; background: #ececec; box-shadow: inset 6px 6px 14px rgba(0,0,0,.12), inset -6px -6px 14px rgba(255,255,255,.9); display: grid; place-items: center; text-align: center; }
  .dial b { display: block; font-size: 46px; color: var(--o); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .dial small { font-size: 14px; color: var(--muted); }
  .dial i { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; transition: color .3s; }
  .dial.is-stable i { color: #2f9e57; }
  .dial svg { position: absolute; inset: 8px; width: 174px; height: 174px; }
  .portion { display: flex; align-items: baseline; justify-content: center; gap: 12px; margin: 22px 0 4px; font-size: 18px; color: var(--muted); }
  .portion b { font-size: 40px; color: var(--o); }
  .portion s { color: #b5b5b5; }
  .v2 .sheet { background: #fff; box-shadow: 0 -10px 40px rgba(0,0,0,.12); }
  .v2 .sheet h3 { font-size: 22px; font-weight: 500; color: var(--ink); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 14px; border-radius: 18px; background: #f3f3f3; font-size: 15px; }
  .row i { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-style: normal; font-size: 18px; }
  .row span { flex: 1; } .row em { font-style: normal; font-size: 13px; color: #34a853; }
  .row em.wait { color: var(--muted); }
  .spin { width: 16px; height: 16px; border: 2px solid #ccc; border-top-color: var(--o); border-radius: 50%; animation: s 1s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* Fitfido prototypes, wired the way the Figma prototype is: ?mode=before is the first app, ?mode=after the second.
   Screens are layered exports from Figma (a fixed base, a scrolling layer, the fixed nav), all in the screen's own
   points (393 x 852). Hotspots on a scrolling layer use that layer's coordinates. A few screens Figma didn't have
   (weigh-in, adjust plan, add device) are drawn here in each version's style. Every screen carries data-testid
   so the case-study page can explain where the visitor is. */
const MODE = new URLSearchParams(location.search).get("mode") === "before" ? "before" : "after";
const PRE = MODE === "before" ? "b-" : "a-";
const app = document.getElementById("app");
app.className = MODE === "before" ? "v1" : "v2";
const S = (n) => "s/" + n + ".webp?v=2";

/* ---------- screens ---------- */
const NAV1 = [{ x: 21, y: 774, w: 117, h: 56, tab: "home" }, { x: 138, y: 774, w: 117, h: 56, tab: "feeder" }, { x: 255, y: 774, w: 116, h: 56, tab: "settings" }];
const NAV2 = [{ x: 63, y: 765, w: 62, h: 58, tab: "home1" }, { x: 131, y: 765, w: 62, h: 58, tab: "device1" }, { x: 199, y: 765, w: 62, h: 58, tab: "appt" }, { x: 267, y: 765, w: 62, h: 58, tab: "profile" }];
const nav2 = (img) => ({ img: S("v2-nav-" + img), y: 700, h: 152, hs: NAV2 });

const SCREENS = MODE === "before" ? {
  home: { base: S("v1-home"), ring: true, hs: [
    { x: 236, y: 522, w: 112, h: 66, act: "adjust" },
    { x: 34, y: 698, w: 120, h: 36, act: "weigh" },
    { x: 26, y: 650, w: 160, h: 46, act: "weigh" },
    { x: 200, y: 650, w: 170, h: 92, tab: "feeder" },
    { x: 290, y: 418, w: 80, h: 26, tab: "feeder" },
    ...NAV1] },
  feeder: { base: S("v1-feeder"), mode: true, hs: [
    { x: 40, y: 634, w: 150, h: 62, go: "upload" },
    { x: 204, y: 634, w: 154, h: 62, go: "upload" },
    ...NAV1] },
  upload: { base: S("v1-upload"), hs: [{ x: 14, y: 50, w: 54, h: 54, back: 1 }, { x: 140, y: 724, w: 112, h: 112, go: "food" }] },
  food: { base: S("v1-food"), hs: [{ x: 14, y: 50, w: 54, h: 54, back: 1 }, { x: 20, y: 725, w: 353, h: 62, act: "autoAdjust" }, { x: 110, y: 794, w: 172, h: 28, back: 1 }] },
  settings: { base: S("v1-settings"), hs: [...NAV1] },
} : {
  onboarding: { base: S("v2-onboarding"), auto: { after: 1600, tab: "home1" }, hs: [{ x: 200, y: 754, w: 122, h: 46, tab: "home1" }] },
  // Home: the card list scrolls; swipe or tap an avatar to switch pets
  home1: { base: S("v2-home1-bg"), swipe: [null, "home2"], sc: { x: 13, y: 59, w: 368, h: 793, img: S("v2-home1-sc"), ch: 1004, hs: [
    { x: 85, y: 12, w: 62, h: 90, tab: "home2", dir: 1 }, { x: 158, y: 12, w: 62, h: 90, tab: "home3", dir: 1 }, { x: 192, y: 640, w: 170, h: 70, go: "camera" }] }, fx: nav2("home") },
  home2: { base: S("v2-home2-bg"), swipe: ["home1", "home3"], sc: { x: 13, y: 59, w: 368, h: 793, img: S("v2-home2-sc"), ch: 1004, hs: [
    { x: 0, y: 12, w: 52, h: 90, tab: "home1", dir: -1 }, { x: 134, y: 12, w: 62, h: 90, tab: "home3", dir: 1 }, { x: 192, y: 640, w: 170, h: 70, go: "camera" }] }, fx: nav2("home") },
  home3: { base: S("v2-home3-bg"), swipe: ["home2", null], sc: { x: 13, y: 59, w: 368, h: 793, img: S("v2-home3-sc"), ch: 1004, hs: [
    { x: 0, y: 12, w: 28, h: 90, tab: "home1", dir: -1 }, { x: 36, y: 12, w: 62, h: 90, tab: "home2", dir: -1 }, { x: 192, y: 640, w: 170, h: 70, go: "camera" }] }, fx: nav2("home") },
  // Devices: one card per device, swipe or tap the icons to switch; toggles work
  device1: { base: S("v2-dev1-bg"), swipe: [null, "device2"], sc: { x: 0, y: 0, w: 393, h: 852, img: S("v2-dev1-sc"), ch: 1121,
    tg: [{ x: 26, y: 436, w: 120, h: 64, a: "auto", on: 0 }, { x: 26, y: 496, w: 120, h: 64, a: "conn", on: 1 }],
    hs: [{ x: 108, y: 68, w: 60, h: 84, tab: "device2", dir: 1 }, { x: 176, y: 96, w: 56, h: 56, act: "addDevice" }, { x: 13, y: 369, w: 340, h: 199, go: "feeder" }] }, fx: nav2("dev") },
  device2: { base: S("v2-dev2-bg"), swipe: ["device1", null], sc: { x: 0, y: 0, w: 393, h: 852, img: S("v2-dev2-sc"), ch: 1121,
    tg: [{ x: 80, y: 436, w: 120, h: 64, a: "auto", on: 1 }, { x: 80, y: 496, w: 120, h: 64, a: "conn", on: 1 }],
    hs: [{ x: 16, y: 68, w: 66, h: 84, tab: "device1", dir: -1 }, { x: 156, y: 96, w: 56, h: 56, act: "addDevice" }, { x: 67, y: 369, w: 313, h: 199, go: "scale" }] }, fx: nav2("dev") },
  // Device details: the feeder and scale pages sit side by side; swipe between them
  feeder: { base: S("v2-det1-bg"), swipe: [null, "scale"], sc: { x: 0, y: 0, w: 393, h: 852, img: S("v2-det1-sc"), ch: 1127,
    tg: [{ x: 223, y: 580, w: 103, h: 64, a: "sw", on: 1 }, { x: 224, y: 830, w: 103, h: 64, a: "sw", on: 0 }],
    hs: [{ x: 27, y: 55, w: 60, h: 60, back: 1, to: "device1" }, { x: 124, y: 760, w: 111, h: 57, go: "camera" }] }, fx: nav2("det") },
  scale: { base: S("v2-det2-bg"), swipe: ["feeder", null], sc: { x: 0, y: 0, w: 393, h: 852, img: S("v2-det2-sc"), ch: 1127,
    tg: [{ x: 263, y: 822, w: 103, h: 64, a: "sw", on: 0 }],
    hs: [{ x: 27, y: 55, w: 60, h: 60, back: 1, to: "device2" }, { x: 76, y: 553, w: 126, h: 56, act: "zero" }] }, fx: nav2("det") },
  // Treat camera, gallery and the AI diet plan
  camera: { base: S("v2-camera"), scan: true, hs: [{ x: 27, y: 55, w: 60, h: 60, back: 1 }, { x: 27, y: 745, w: 60, h: 60, go: "gallery1" }, { x: 156, y: 734, w: 82, h: 82, swap: "captured" }] },
  captured: { base: S("v2-captured"), hs: [{ x: 27, y: 55, w: 60, h: 60, swap: "camera" }, { x: 27, y: 745, w: 60, h: 60, go: "gallery1" }, { x: 156, y: 734, w: 82, h: 82, go: "plan" }] },
  gallery1: { base: S("v2-gallery1"), hs: [{ x: 27, y: 55, w: 60, h: 60, back: 1 }, { x: 299, y: 313, w: 60, h: 60, back: 1 }, { x: 37, y: 385, w: 100, h: 100, swap: "gallery2" }, { x: 156, y: 734, w: 82, h: 82, go: "captured" }] },
  gallery2: { base: S("v2-gallery2"), hs: [{ x: 27, y: 55, w: 60, h: 60, back: 1 }, { x: 299, y: 313, w: 60, h: 60, back: 1 }, { x: 237, y: 313, w: 60, h: 60, go: "plan" }, { x: 37, y: 385, w: 100, h: 100, swap: "gallery1" }, { x: 156, y: 734, w: 82, h: 82, go: "captured" }] },
  plan: { base: S("v2-plan"), hs: [{ x: 27, y: 55, w: 60, h: 60, back: 1 }, { x: 56, y: 781, w: 124, h: 57, back: 1 }, { x: 182, y: 781, w: 151, h: 57, act: "feedAndLog" }] },
  // Health Care: the doctor sheet scrolls up under a fixed nav
  appt: { sc: { x: 0, y: 0, w: 393, h: 852, img: S("v2-appt-sc"), ch: 1126, hs: [{ x: 310, y: 192, w: 59, h: 59, swap: "apptCancel" }] }, fx: nav2("appt") },
  apptCancel: { sc: { x: 0, y: 0, w: 393, h: 852, img: S("v2-appt-cancel-sc"), ch: 1126, hs: [{ x: 246, y: 192, w: 123, h: 59, swap: "apptNone" }, { x: 13, y: 260, w: 368, h: 240, swap: "appt" }] }, fx: nav2("appt") },
  apptNone: { base: S("v2-appt-none"), hs: [...NAV2] },
  profile: { sc: { x: 0, y: 0, w: 393, h: 852, img: S("v2-profile-sc"), ch: 1024, hs: [
    { x: 26, y: 362, w: 70, h: 96, tab: "home1" }, { x: 108, y: 362, w: 70, h: 96, tab: "home2" },
    { x: 26, y: 786, w: 342, h: 50, tab: "device1" }, { x: 30, y: 911, w: 334, h: 50, tab: "onboarding" }] }, fx: nav2("profile") },
};
const START = MODE === "before" ? "home" : "onboarding";
const TOGGLES = { auto: ["v2-auto0", "v2-auto1"], conn: ["v2-conn0", "v2-conn1"], sw: ["v2-sw0", "v2-sw1"] };

/* ---------- building ---------- */
const els = {};
const btn = (h, onClick) => {
  const b = document.createElement("button");
  b.className = "hs"; b.style.cssText = `left:${h.x}px;top:${h.y}px;width:${h.w}px;height:${h.h}px`;
  b.setAttribute("aria-label", h.go || h.tab || h.swap || h.act || "back");
  b.addEventListener("click", (e) => { e.stopPropagation(); if (!dragged) onClick(h); });
  return b;
};
const make = (id) => {
  if (els[id]) return els[id];
  const s = SCREENS[id], el = document.createElement("div");
  el.className = "scr"; el.dataset.testid = PRE + id;
  if (s.base) el.insertAdjacentHTML("beforeend", `<img class="base" src="${s.base}" alt="">`);
  if (s.ring) el.insertAdjacentHTML("beforeend", `<svg class="layer" style="left:45px;top:140px;width:143px;height:143px" viewBox="0 0 143 143"><circle id="ring" cx="71.5" cy="71.5" r="71" fill="none" stroke="#f4f4f4" stroke-width="2.6" stroke-linecap="round" transform="rotate(-90 71.5 71.5)" pathLength="100" stroke-dasharray="0 100"/></svg>`);
  if (s.mode) el.insertAdjacentHTML("beforeend", `<img class="layer" id="mode" src="${S("v1-mode-protein")}" style="left:23px;top:248px;width:351px;opacity:0;transition:opacity .25s" alt="">`);
  if (s.scan) el.insertAdjacentHTML("beforeend", `<img class="layer" id="scan" src="${S("v2-scan0")}" style="left:0;top:134px;width:393px" alt="">`);
  (s.hs || []).forEach((h) => el.append(btn(h, act)));
  if (s.mode) [["ai", 133, 336, 120, 44], ["protein", 256, 336, 112, 44]].forEach(([m, x, y, w, hh]) => el.append(btn({ x, y, w, h: hh, act: "mode" }, () => setMode(el, m))));
  if (s.sc) {
    const sc = document.createElement("div"), inn = document.createElement("div");
    sc.className = "sc"; sc.style.cssText = `left:${s.sc.x}px;top:${s.sc.y}px;width:${s.sc.w}px;height:${s.sc.h}px`;
    inn.className = "in"; inn.style.height = s.sc.ch + "px";
    inn.insertAdjacentHTML("beforeend", `<img src="${s.sc.img}" style="width:${s.sc.w}px" alt="">`);
    (s.sc.hs || []).forEach((h) => inn.append(btn(h, act)));
    (s.sc.tg || []).forEach((t) => {
      const d = document.createElement("div"); d.className = "tg"; d.style.cssText = `left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px`;
      const im = document.createElement("img"); im.src = S(TOGGLES[t.a][t.on]); im.alt = ""; d.append(im);
      d.addEventListener("click", (e) => { e.stopPropagation(); if (dragged) return; t.on = 1 - t.on; im.src = S(TOGGLES[t.a][t.on]); });
      inn.append(d);
    });
    sc.append(inn); el.append(sc);
    sc.addEventListener("scroll", () => { el.toggleAttribute("data-scrolled", sc.scrollTop > 60); }, { passive: true });
  }
  if (s.fx) {
    const fx = document.createElement("div"); fx.className = "fx"; fx.style.cssText = `top:${s.fx.y}px;height:${s.fx.h}px`;
    fx.insertAdjacentHTML("beforeend", `<div class="glass" style="left:${s.fx.img.includes("det") ? 59 : 55}px"></div><img src="${s.fx.img}" style="position:relative;width:393px" alt="">`);
    s.fx.hs.forEach((h) => fx.append(btn({ ...h, y: h.y - s.fx.y }, act)));
    el.append(fx);
  }
  app.append(el); els[id] = el; return el;
};
const setMode = (el, m) => { el.querySelector("#mode").style.opacity = m === "protein" ? 1 : 0; el.toggleAttribute("data-protein", m === "protein"); toast(m === "protein" ? "Protein+ on: more protein, 2% smaller portions" : "AI Recommend on"); };

/* ---------- navigation (Figma: smart animate ≈ a short dissolve; swipes slide) ---------- */
let cur = null, stack = [], timers = [];
const show = (id, how = "fade", dir = 1) => {
  const next = make(id), prev = cur && els[cur];
  if (prev === next) return;
  timers.forEach(clearTimeout); timers = [];
  Object.values(els).forEach((e) => { if (e !== prev && e !== next) { e.className = "scr"; e.style.transform = ""; } });
  const sc = next.querySelector(".sc"); if (sc && how !== "swap") sc.scrollTop = 0;
  if (how !== "swap") next.removeAttribute("data-scrolled");
  if (how === "slide") {
    next.style.transition = "none"; next.style.transform = `translateX(${dir * 100}%)`; next.className = "scr is-cur"; void next.offsetWidth; next.style.transition = "";
    next.style.transform = ""; if (prev) { prev.className = "scr is-prev"; prev.style.transform = `translateX(${-dir * 30}%)`; }
  } else {
    next.style.transform = ""; next.className = "scr is-cur";
    if (how === "swap") { next.style.transition = "none"; void next.offsetWidth; next.style.transition = ""; }
    if (prev) { prev.className = "scr is-prev"; prev.style.transform = ""; }
  }
  if (prev) { const p = prev; timers.push(setTimeout(() => { if (els[cur] !== p) { p.className = "scr"; p.style.transform = ""; } }, 360)); }
  cur = id;
  onShow(id, next);
};
const act = (h) => {
  if (h.back) { const to = stack.pop() || h.to || START; show(to); return; }
  if (h.go) { stack.push(cur); show(h.go); return; }
  if (h.tab) { stack = []; show(h.tab, h.dir ? "slide" : "fade", h.dir || 1); return; }
  if (h.swap) { show(h.swap, "swap"); return; }
  if (h.act) actions[h.act](h);
};
const onShow = (id, el) => {
  const s = SCREENS[id];
  if (s.auto) timers.push(setTimeout(() => { if (cur === id) act({ tab: s.auto.tab }); }, s.auto.after));
  if (s.ring) { const r = el.querySelector("#ring"); r.style.transition = "none"; r.setAttribute("stroke-dasharray", "0 100"); requestAnimationFrame(() => requestAnimationFrame(() => { r.style.transition = "stroke-dasharray 1.6s cubic-bezier(.3,.6,.2,1)"; r.setAttribute("stroke-dasharray", "73 100"); })); }
  if (s.scan) { let i = 0; const im = el.querySelector("#scan"); const step = () => { if (cur !== id) return; i = (i + 1) % 4; im.src = S("v2-scan" + i); timers.push(setTimeout(step, 300)); }; timers.push(setTimeout(step, 300)); }
};

/* ---------- swipe between sibling screens (Figma: drag) ---------- */
let dragged = false, d0 = null;
app.addEventListener("pointerdown", (e) => { d0 = { x: e.clientX, y: e.clientY }; dragged = false; });
app.addEventListener("pointermove", (e) => { if (d0 && Math.abs(e.clientX - d0.x) > 12 && Math.abs(e.clientX - d0.x) > Math.abs(e.clientY - d0.y)) dragged = true; });
app.addEventListener("pointerup", (e) => {
  if (!d0) return; const dx = e.clientX - d0.x, dy = e.clientY - d0.y; d0 = null;
  const sw = cur && SCREENS[cur].swipe;
  if (sw && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) { const to = dx < 0 ? sw[1] : sw[0]; if (to) show(to, "slide", dx < 0 ? 1 : -1); }
  setTimeout(() => (dragged = false), 0);
});
let wheelX = 0, wheelT = 0;
app.addEventListener("wheel", (e) => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  const sw = cur && SCREENS[cur].swipe; if (!sw) return;
  e.preventDefault(); const now = Date.now(); if (now - wheelT < 600) return;
  wheelX += e.deltaX; if (Math.abs(wheelX) > 60) { const to = wheelX > 0 ? sw[1] : sw[0]; wheelX = 0; if (to) { wheelT = now; show(to, "slide", e.deltaX > 0 ? 1 : -1); } }
}, { passive: false });

/* ---------- small flows the designs didn't draw ---------- */
const toast = (t) => { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("is-on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("is-on"), 2400); };
const sheet = (html, id, onOpen) => {
  const veil = document.createElement("div"), sh = document.createElement("div");
  veil.className = "veil"; sh.className = "sheet"; sh.dataset.testid = PRE + "ov-" + id; sh.innerHTML = html;
  app.append(veil, sh); requestAnimationFrame(() => { veil.classList.add("is-on"); sh.classList.add("is-on"); });
  let done = false;
  const close = () => { if (done) return; done = true; veil.classList.remove("is-on"); sh.classList.remove("is-on"); delete sh.dataset.testid; setTimeout(() => { veil.remove(); sh.remove(); }, 420); };
  veil.onclick = (e) => { e.stopPropagation(); close(); };
  sh.addEventListener("click", (e) => e.stopPropagation());
  sh.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", close));
  if (onOpen) onOpen(sh, close);
};
const actions = {
  // A scale reading wobbles while the dog shifts its weight, then settles
  weigh: () => sheet(`<h3>Weighing Jelly</h3><p>Ask Jelly to stand still on the Smart Scale.</p>
      <div class="dial"><svg viewBox="0 0 174 174"><circle cx="87" cy="87" r="80" fill="none" stroke="#f0611f" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 503" id="arc" transform="rotate(-90 87 87)"/></svg><div><b id="kg">--.-</b><small>kg</small></div><i id="st">Measuring…</i></div>
      <button class="btn" data-close>Done</button>`, "weigh", (sh) => {
      const kg = sh.querySelector("#kg"), arc = sh.querySelector("#arc"), st = sh.querySelector("#st"), dial = sh.querySelector(".dial");
      const t0 = performance.now() + 350, T = 2600;
      const tick = (now) => {
        if (!sh.isConnected) return;
        if (now < t0) { requestAnimationFrame(tick); return; }
        const k = Math.min(1, (now - t0) / T), amp = 0.8 * Math.pow(1 - k, 2);
        const v = k < .1 ? 12.5 * (k / .1) : 12.5 + amp * Math.sin(now / 110) * Math.cos(now / 260);
        kg.textContent = v.toFixed(1); arc.setAttribute("stroke-dasharray", `${503 * k} 503`);
        if (k < 1) requestAnimationFrame(tick); else { kg.textContent = "12.5"; dial.classList.add("is-stable"); st.textContent = "✓ Stable · saved"; }
      };
      requestAnimationFrame(tick); }),
  adjust: () => sheet(`<h3>Adjust today’s plan</h3><p>Jelly is 0.4 kg above target this week. Fitfido suggests a smaller portion.</p>
      <div class="portion"><s>245 g</s>→<b>230 g</b></div>
      <button class="btn" id="ok">Apply to feeder</button><button class="btn btn--ghost" data-close>Not now</button>`, "adjust", (sh, close) => {
      sh.querySelector("#ok").onclick = () => { close(); toast("Feeder updated: 230 g today"); }; }),
  autoAdjust: () => { stack = []; show("home"); toast("Feeder set to 2.5 cups/day for this food"); },
  addDevice: () => sheet(`<h3>Add a device</h3>
      <div class="row"><i>🍽️</i><span>Smart Feeder</span><em>Paired</em></div>
      <div class="row"><i>⚖️</i><span>Smart Scale</span><em>Paired</em></div>
      <div class="row"><i>💧</i><span>Smart Fountain</span><em class="wait"><span class="spin"></span>Searching</em></div>
      <button class="btn" data-close>Done</button>`, "adddev"),
  zero: () => toast("Scale zeroed"),
  feedAndLog: () => { stack = ["device1"]; show("feeder"); toast("Logged. Tonight’s dinner is now 135 g."); },
};

/* tapping where nothing happens flashes the tappable areas, like a Figma prototype */
app.addEventListener("click", () => { if (dragged) return; app.classList.remove("is-hint"); void app.offsetWidth; app.classList.add("is-hint"); });
// the case-study page can restart the prototype
addEventListener("message", (e) => { if (e.data && e.data.type === "fitfido-restart") { stack = []; show(START); } });
show(START);
</script>
