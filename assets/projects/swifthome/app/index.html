<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402, initial-scale=1">
<title>SwiftHome app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;700;800&display=swap">
<style>
  :root { --ink: #231a14; --bar: #36291f; --acc: #a9845a; --soft: #fff; --line: #ddd3c7; --muted: #8d837b; --ebg: #f0eae2; --epromo: #dcc4a5; --edark: #36291f; --eacc: #a9845a; --d: Manrope, "Instrument Sans", sans-serif; --f: "Instrument Sans", -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 402px; height: 874px; overflow: hidden; overscroll-behavior: none; background: #fff; font-family: var(--f); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button, input { font-family: inherit; color: inherit; }
  #app { position: relative; width: 402px; height: 874px; overflow: hidden; background: #fff; touch-action: pan-y; }
  img { display: block; user-select: none; -webkit-user-drag: none; }
  .scr img { pointer-events: none; }
  /* screens */
  .scr { position: absolute; inset: 0; overflow: hidden; background: #fff; pointer-events: none; visibility: hidden; transition: transform .42s cubic-bezier(.25,.8,.25,1), opacity .32s ease; }
  .scr.is-cur { pointer-events: auto; visibility: visible; z-index: 2; }
  .scr.is-prev { visibility: visible; z-index: 1; }
  .scr::after { content: ""; position: absolute; inset: 0; background: rgba(28,18,10,.22); opacity: 0; pointer-events: none; transition: opacity .42s; z-index: 60; }
  .scr.dim::after { opacity: 1; }
  /* tactile press on everything tappable */
  :is(.btn, .pill, .chip, .res, .cg, .cv-card, .totalbar, .save-bar, .thumb, .ar-btn, .back, .cv-card .go, .cbar-bag, .row-opt, .opt):active { scale: .965; }
  .hs:active { background: rgba(255,255,255,.16); }
  .scr > .base { position: absolute; left: 0; top: 0; width: 402px; }
  .sc { position: absolute; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; scroll-behavior: smooth; }
  .sc::-webkit-scrollbar, .pg::-webkit-scrollbar { display: none; }
  .sc .in { position: relative; }
  .fx { position: absolute; left: 0; width: 402px; pointer-events: none; z-index: 5; }
  .fx > * { pointer-events: auto; }
  .fx > img { pointer-events: none; width: 402px; }
  .hs { position: absolute; border: 0; background: transparent; cursor: pointer; border-radius: 14px; -webkit-tap-highlight-color: transparent; }
  .hs:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .pg { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
  .tap { cursor: pointer; }
  /* cart badge on every bar */
  /* rebuilt category grid */
  .cg { position: absolute; width: 150px; height: 190px; border: 0; border-radius: 16px; background: var(--bg); box-shadow: 0 6px 14px rgba(0,0,0,.08); cursor: pointer; text-align: left; overflow: visible; animation: cgIn .45s cubic-bezier(.25,.8,.25,1) both; }
  .cg:nth-child(2) { animation-delay: .05s; } .cg:nth-child(3) { animation-delay: .1s; } .cg:nth-child(4) { animation-delay: .15s; } .cg:nth-child(5) { animation-delay: .2s; } .cg:nth-child(6) { animation-delay: .25s; }
  @keyframes cgIn { from { opacity: 0; transform: translateY(14px); } }
  .cg-ph { position: absolute; left: 6px; right: 6px; top: -14px; height: 140px; display: grid; place-items: center; }
  .cg-ph img { max-width: 100%; max-height: 100%; filter: drop-shadow(0 8px 10px rgba(0,0,0,.15)); }
  /* cards cut from the design: the chair pops out above the card, as in the original */
  .cg.baked { background: linear-gradient(to bottom, transparent var(--top), var(--bg) var(--top)); box-shadow: none; }
  .cg-ph.full { left: 0; right: 0; top: 0; height: auto; display: block; }
  .cg-ph.full img { width: 150px; max-width: none; max-height: none; filter: none; }
  .cg small { position: absolute; left: 16px; top: 138px; font-size: 8px; color: #7a6f66; }
  .cg b { position: absolute; left: 16px; top: 156px; font-size: 13px; font-weight: 700; } .cg b i { font-style: normal; font-weight: 600; }
  .cg em { position: absolute; right: 14px; top: 162px; display: flex; gap: 3px; } .cg em u { width: 4px; height: 4px; border-radius: 50%; background: #fff; } .cg em u:nth-child(2) { background: #d7b597; } .cg em u:nth-child(3) { background: #555; }
  .badge { position: absolute; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #e2b48f; color: #3f2c1f; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center; pointer-events: none; box-shadow: 0 0 0 2px #3f2c1f; transition: transform .2s; }
  .badge.bump { animation: bump .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bump { 40% { transform: scale(1.5); } }
  /* toast */
  .toast { position: absolute; left: 50%; bottom: 112px; z-index: 80; transform: translate(-50%, 14px); opacity: 0; width: max-content; max-width: 340px; padding: 11px 18px; border-radius: 22px; background: rgba(58,39,26,.94); color: #fff; font-size: 13px; line-height: 1.35; text-align: center; transition: .3s; pointer-events: none; }
  .toast.is-on { transform: translate(-50%, 0); opacity: 1; }

  /* the product page bottom bar: dynamic white pill on top of the exported bar */
  .cbar { position: absolute; left: 22px; top: 26px; width: 358px; height: 54px; border-radius: 27px; background: var(--bar); box-shadow: 0 10px 24px rgba(63,44,31,.3); pointer-events: none; }
  .cbar-bag { position: absolute; left: 8px; top: 7px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; color: #fff; }
  .cbar-bag svg { width: 19px; height: 20px; }
  .pill { position: absolute; left: 80px; height: 37px; width: 292px; border: 0; border-radius: 18.5px; background: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; overflow: hidden; }
  .pill b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .pill small { font-size: 11px; color: var(--ink); }
  .pill svg { flex: none; }
  .pill .saved { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; background: #fff; font-size: 18px; font-weight: 700; transform: translateY(100%); transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
  .pill.is-saved .saved { transform: none; }

  /* ---------- product detail ---------- */
  .pd-hero { position: absolute; left: 0; top: 0; width: 402px; height: 421px; transition: background .5s; overflow: hidden; }
  .pd-img { position: absolute; left: 39px; top: 65px; width: 338px; height: 342px; overflow: hidden; }
  .pd-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: transform .6s cubic-bezier(.25,.8,.25,1), opacity .35s, filter .4s; }
  .pd-img img.out { opacity: 0; }
  .pd-img.cut img { left: 28px; top: 30px; width: calc(100% - 56px); height: calc(100% - 74px); filter: drop-shadow(0 16px 18px rgba(0,0,0,.14)); }
  .chip-rate { position: absolute; left: 65px; top: 70px; width: 84px; height: 25px; border-radius: 21.5px; border: 1px solid #61534a; background: rgba(255,255,255,.28); box-shadow: 0 4px 8.6px rgba(0,0,0,.27); font-size: 13px; font-weight: 700; color: #61534a; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .link360 { position: absolute; left: 277px; top: 62px; height: 34px; border: 0; background: none; font-size: 13px; color: #61534a; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .back { position: absolute; left: 22px; top: 62px; width: 40px; height: 40px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .back.glass { left: 16px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.82); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .back.glass svg { width: 18px; }
  .heart { position: absolute; left: 344px; top: 104px; width: 42px; height: 42px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .heart svg path { transition: fill .25s, stroke .25s; }
  .heart.on svg { animation: pop .45s cubic-bezier(.3,1.7,.5,1); }
  .heart .burst { position: absolute; inset: 0; pointer-events: none; }
  .heart .burst i { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: #dc0c0c; opacity: 0; }
  .heart.on .burst i { animation: burst .6s ease-out; }
  @keyframes pop { 30% { transform: scale(.7); } 60% { transform: scale(1.25); } }
  @keyframes burst { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-22px); } }
  .thumbs { position: absolute; left: 35px; top: 365px; display: flex; gap: 13px; }
  .thumb { width: 42px; height: 42px; border: 0; border-radius: 7px; background: #fff; padding: 2px; cursor: pointer; opacity: .62; transition: opacity .2s, box-shadow .2s, transform .2s; overflow: hidden; }
  .thumb.on { opacity: 1; box-shadow: 0 0 0 1.5px var(--acc), 0 4px 10px rgba(0,0,0,.12); transform: translateY(-2px); }
  .thumb div { width: 38px; height: 38px; border-radius: 6px; overflow: hidden; position: relative; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .vline { position: absolute; left: 259px; top: 365px; width: 1px; height: 42px; background: var(--line); }
  .dots { position: absolute; left: 277px; top: 377px; display: flex; gap: 19px; }
  .dot { width: 17px; height: 17px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: 0 0 0 0 #fff; transition: box-shadow .2s, transform .2s; }
  .dot.on { box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.25); transform: scale(1.08); }
  .pd-body { position: absolute; left: 0; top: 421px; width: 402px; background: #fff; }
  .pd-title { height: 55px; padding-left: 35px; font-size: 24px; font-weight: 600; line-height: 70px; white-space: nowrap; }
  .pd-desc { position: relative; margin-left: 37px; width: 329px; font-size: 10px; line-height: 12px; max-height: 24px; overflow: hidden; transition: max-height .45s cubic-bezier(.25,.8,.25,1); }
  .pd-desc.open { max-height: 120px; }
  .pd-more { display: block; margin: 2px 0 0 300px; border: 0; background: none; font-size: 8px; color: #c2b59a; cursor: pointer; }
  .pd-hr { margin: 6px 36px 0; height: 0; border-top: .7px solid rgba(198,195,189,.6); }
  .pd-h { display: flex; align-items: center; gap: 12px; height: 35px; margin-top: 4px; padding-left: 36px; font-size: 15px; font-weight: 700; }
  .pd-h em { font-style: italic; font-weight: 400; font-size: 8px; color: #b88f6f; border: .7px solid #b88f6f; border-radius: 20px; padding: 1px 6px; }
  .rent { position: relative; height: 55px; margin: 0 29px 0 39px; }
  .rent .track { position: absolute; left: 0; top: 0; width: 334px; height: 9px; border-radius: 20px; background: rgba(217,217,217,.58); }
  .rent .fill { position: absolute; left: 0; top: 0; height: 9px; border-radius: 20px; background: linear-gradient(90deg, #e6d6c6, #d3b49a); transition: width .25s; }
  .rent .tick { position: absolute; top: 0; width: 1px; height: 9px; background: var(--line); }
  .rent .knob { position: absolute; top: -4px; width: 17px; height: 17px; margin-left: -8.5px; border-radius: 50%; background: var(--acc); box-shadow: 0 2px 6px rgba(0,0,0,.25); cursor: grab; transition: left .25s cubic-bezier(.3,1.3,.5,1); touch-action: none; }
  .rent .knob.drag { transition: none; cursor: grabbing; transform: scale(1.2); }
  .rent .lab { position: absolute; top: 18px; font-size: 10px; cursor: pointer; color: var(--ink); transition: color .2s, font-weight .2s; }
  .rent .lab.on { font-weight: 700; color: var(--acc); }
  .rent .hit { position: absolute; left: -10px; right: -10px; top: -12px; height: 34px; cursor: pointer; }
  .sizes { position: relative; display: flex; height: 48px; margin: 4px 29px 0 35px; border-radius: 10px; background: var(--soft); }
  .sizes button { position: relative; z-index: 1; flex: 1; border: 0; background: none; cursor: pointer; text-align: center; font-size: 13px; font-weight: 600; line-height: 16px; }
  .sizes button small { display: block; font-size: 10px; font-weight: 400; line-height: 12px; }
  .sizes .sel { position: absolute; top: 0; height: 48px; border-radius: 24px; background: #fff; box-shadow: 4px 4px 10px rgba(0,0,0,.18); transition: left .35s cubic-bezier(.3,1.2,.5,1), width .35s; }
  .gallery { margin: 9px 29px 0 36px; height: 475px; border-radius: 10px; overflow: hidden; }
  .gallery img { width: 100%; height: 100%; object-fit: cover; transition: opacity .4s; }

  /* ---------- AR ---------- */
  /* cover: full-screen colour per piece, swipe sideways between pieces, swipe up to explore */
  .cv-panel { position: absolute; inset: 0; overflow: hidden; transition: background-color .6s; touch-action: none; cursor: grab; }
  .cv-panel h1 { position: absolute; left: 24px; top: 68px; margin: 0; font: 300 46px/1.04 Manrope, var(--f); letter-spacing: -.035em; color: var(--ink); z-index: 2; pointer-events: none; }
  .cv-panel h1 b { font-weight: 800; }
  .cv-panel h1 .circ { position: relative; display: inline-block; }
  .cv-panel h1 .circ svg { position: absolute; left: -16px; top: -8px; width: calc(100% + 30px); height: calc(100% + 22px); overflow: visible; }
  .cv-panel h1 .circ path { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 340; stroke-dashoffset: 340; animation: cvDraw 1.1s .5s cubic-bezier(.6,0,.3,1) forwards; }
  @keyframes cvDraw { to { stroke-dashoffset: 0; } }
  .cv-track { position: absolute; inset: 0; display: flex; z-index: 1; transition: transform .55s cubic-bezier(.25,.8,.25,1); }
  .cv-slide { position: relative; flex: none; width: 402px; height: 874px; overflow: hidden; }
  .cv-slide > img { position: absolute; left: 10px; top: 290px; width: 372px; height: 420px; object-fit: contain; object-position: 50% 100%; pointer-events: none; animation: cvFloat 5s ease-in-out infinite; transition: opacity .6s, scale .7s cubic-bezier(.2,.8,.2,1), filter .4s; }
  .cv-floor { position: absolute; left: 50px; top: 674px; width: 290px; height: 30px; border-radius: 50%; background: radial-gradient(closest-side, rgba(50,32,20,.3), transparent); pointer-events: none; animation: cvShadow 5s ease-in-out infinite; }
  .cv-card { position: absolute; left: 208px; top: 300px; width: 172px; height: 118px; padding: 0; border-radius: 18px; border: 1px solid rgba(255,255,255,.7); background: rgba(255,255,255,.42); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 12px 30px rgba(60,40,25,.10); text-align: left; cursor: pointer; z-index: 2; transition: opacity .5s .15s, translate .6s .15s cubic-bezier(.2,.8,.2,1); }
  .cv-card b { position: absolute; left: 16px; top: 15px; font-size: 16px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .cv-card .dots { position: absolute; left: 16px; top: 47px; display: flex; gap: 9px; }
  .cv-card .dots i { position: relative; width: 13px; height: 13px; border-radius: 50%; transition: box-shadow .25s; }
  .cv-card .dots i::after { content: ""; position: absolute; inset: -7px; }
  .cv-card .dots i.on { box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(58,39,26,.45); }
  .cv-card .pr { position: absolute; left: 16px; top: 82px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .cv-card .pr small { font-size: 11px; font-weight: 400; color: #6f6259; }
  .cv-card .go { position: absolute; right: 12px; bottom: 12px; width: 34px; height: 34px; border-radius: 50%; background: var(--bar); display: grid; place-items: center; }
  .cv-card .go svg { transform: rotate(-45deg); }
  .cv-card .go path { stroke: #fff; }
  .cv-slide:not(.on) > img { opacity: .4; scale: .9; }
  .cv-slide:not(.on) .cv-card { opacity: 0; translate: 0 14px; }
  .cv-ind { position: absolute; left: 0; right: 0; top: 760px; display: flex; justify-content: center; gap: 4px; z-index: 2; }
  .cv-ind button { border: 0; background: none; padding: 6px 4px; cursor: pointer; }
  .cv-ind i { display: block; width: 7px; height: 7px; border-radius: 4px; background: #fff; opacity: .5; transition: width .3s, opacity .3s; }
  .cv-ind .on i { width: 22px; opacity: 1; }
  .cv-hint { position: absolute; left: 50%; top: 800px; transform: translateX(-50%); border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 5px; font: 500 13px var(--f); color: #fff; cursor: pointer; z-index: 3; transition: opacity .3s; }
  .cv-hint svg { animation: cvChev 1.6s ease-in-out infinite; }
  .cv-bag { position: absolute; left: 50%; top: 796px; width: 50px; height: 50px; margin-left: -25px; border-radius: 50%; background: var(--bar); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(63,44,31,.35); transform: translateY(30px) scale(.6); opacity: 0; transition: transform .45s cubic-bezier(.3,1.5,.5,1), opacity .3s; z-index: 6; pointer-events: none; }
  .cv-bag .badge { left: 30px; top: 3px; }
  .cover-bag .cv-bag { transform: none; opacity: 1; }
  .cover-bag .cv-hint { opacity: 0; }
  @keyframes cvFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }
  @keyframes cvShadow { 0%, 100% { scale: 1; opacity: 1; } 50% { scale: .92; opacity: .7; } }
  @keyframes cvChev { 0%, 100% { translate: 0 2px; opacity: .6; } 50% { translate: 0 -4px; opacity: 1; } }
  /* explore (v2): warm oat ground, white cards in two staggered columns, round category icons, cart preview pill */
  .ex { background: var(--ebg); }
  .ex .pg { background: var(--ebg); padding-bottom: 120px; }
  .ex-top { display: flex; justify-content: space-between; align-items: center; padding: 58px 20px 0; }
  .ex-rb { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 0; background: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .ex-rb img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; }
  .ex h1 { margin: 18px 24px 0; font: 800 34px/1.02 Manrope, var(--f); letter-spacing: -.02em; text-transform: uppercase; color: #231a14; }
  .ex-cats { display: flex; gap: 10px; margin: 18px 0 0; padding: 0 22px; overflow-x: auto; scrollbar-width: none; }
  .ex-cats::-webkit-scrollbar { display: none; }
  .ex-cats button { flex: none; width: 56px; height: 56px; border-radius: 50%; border: 0; background: rgba(255,255,255,.6); display: grid; place-items: center; cursor: pointer; color: #231a14; font: 600 14px var(--f); transition: background .25s, color .25s; }
  .ex-cats button.on { background: var(--edark); color: #fff; }
  .ex-cats button.on svg path, .ex-cats button.on svg ellipse, .ex-cats button.on svg rect { stroke: #fff; }
  .ex-promo { position: relative; display: block; width: calc(100% - 40px); margin: 18px 20px 0; height: 112px; border: 0; border-radius: 22px; background: var(--epromo); overflow: hidden; text-align: left; cursor: pointer; padding: 0; }
  .ex-promo p { position: absolute; left: 20px; top: 18px; font: 600 16px/1.25 Manrope, var(--f); color: #2b211a; letter-spacing: -.01em; }
  .ex-promo p b { font-weight: 800; }
  .ex-promo span { position: absolute; left: 20px; bottom: 16px; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; background: #fff; font-size: 11px; font-weight: 600; color: #231a14; }
  .ex-promo img { position: absolute; right: 14px; bottom: 6px; height: 100px; filter: drop-shadow(0 10px 10px rgba(0,0,0,.18)); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .ex-promo:hover img { transform: translateY(-4px) rotate(-2deg); }
  .ex-sec { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 22px 12px 24px; }
  .ex-sec h2 { font: 700 18px Manrope, var(--f); letter-spacing: -.01em; color: #231a14; }
  .ex-sec button { border: 0; background: none; font-size: 13px; color: #8d837b; cursor: pointer; padding: 4px 0; }
  .ex-cols { display: flex; gap: 12px; margin: 0 20px; }
  .ex-col { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .ex-card { position: relative; border: 0; border-radius: 22px; background: #fff; padding: 14px; text-align: left; cursor: pointer; box-shadow: 0 6px 20px rgba(60,40,25,.07); }
  .ex-card img { display: block; width: 100%; object-fit: contain; filter: drop-shadow(0 8px 8px rgba(0,0,0,.1)); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .ex-card:hover img { transform: scale(1.04); }
  .ex-card h3 { margin-top: 8px; font: 700 14px Manrope, var(--f); letter-spacing: -.01em; color: #231a14; }
  .ex-card small { display: block; margin-top: 2px; font-size: 10.5px; color: #8d837b; letter-spacing: .04em; text-transform: uppercase; }
  .ex-card .pr { display: block; margin-top: 8px; font: 800 18px Manrope, var(--f); color: var(--eacc); }
  .ex-card .pr i { font: 400 11px var(--f); color: #8d837b; }
  .ex-add { position: absolute; right: 12px; bottom: 12px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--edark); display: grid; place-items: center; cursor: pointer; transition: transform .2s; }
  .ex-add.ok { animation: exOk .5s cubic-bezier(.3,1.6,.5,1); background: var(--eacc); }
  @keyframes exOk { 40% { transform: scale(1.25); } }
  .ex-card.dark { background: var(--edark); color: #fff; box-shadow: none; }

const bindCover = (w) => {

  panel.addEventListener("pointermove", (e) => { if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.ax && Math.hypot(dx, dy) > 8) { d.ax = Math.abs(dx) > Math.abs(dy) ? "x" : "y"; d.moved = true; panel.setPointerCapture(e.pointerId); t.style.transition = "none"; }

  apply(false);
  let d = null;
  ch.addEventListener("pointerdown", (e) => { e.stopPropagation(); ch.setPointerCapture(e.pointerId); d = { x: e.clientX, y: e.clientY, ax: a.x, ay: a.y }; ch.style.cursor = "grabbing"; });
  ch.addEventListener("pointermove", (e) => { if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y;
    a.x = Math.max(-40, Math.min(110, d.ax + dx)); a.y = Math.max(-260, Math.min(40, d.ay + dy));
    apply(false); });
  const up = () => { d = null; ch.style.cursor = ""; };
  ch.addEventListener("pointerup", up); ch.addEventListener("pointercancel", up);
  w.querySelector(".ar").addEventListener("wheel", (e) => { e.preventDefault(); a.s = Math.max(.45, Math.min(1.6, a.s - e.deltaY * .0015)); apply(false); }, { passive: false });
  w.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); a.mode = b.dataset.mode; if (a.mode === "studio") { a.x = 35; a.y = -150; a.s = 1.05; } else { a.x = 0; a.y = 0; a.s = 1; } render("ar"); const n = els.ar.querySelector("#archair"); n.style.transition = "none"; n.animate([{ opacity: 0, transform: n.style.transform + " translateY(20px)" }, { opacity: 1, transform: n.style.transform }], { duration: 450, easing: "cubic-bezier(.25,.8,.25,1)" }); }));
  w.querySelectorAll("[data-arcolor]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); a.color = b.dataset.arcolor; state.pd.color = a.color; state.pd.saved = false; render("ar"); }));
  w.querySelector("[data-arreset]").addEventListener("click", (e) => { e.stopPropagation(); if (a.mode === "studio") { a.x = 35; a.y = -150; a.s = 1.05; } else { a.x = 0; a.y = 0; a.s = 1; } apply(true); });
};

/* ---------- sheets ---------- */
const toast = (t) => { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("is-on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("is-on"), 2400); };
const sheet = (html, id, onOpen) => {
  app.querySelectorAll(".sheet,.veil").forEach((n) => n.remove());
  const veil = document.createElement("div"), sh = document.createElement("div");
  veil.className = "veil"; sh.className = "sheet"; sh.dataset.testid = "sh-ov-" + id; sh.innerHTML = `<div class="grab"></div>` + html;
  app.append(veil, sh); requestAnimationFrame(() => { veil.classList.add("is-on"); sh.classList.add("is-on"); });
  let done = false;
  const close = () => { if (done) return; done = true; veil.classList.remove("is-on"); sh.classList.remove("is-on"); delete sh.dataset.testid; setTimeout(() => { veil.remove(); sh.remove(); }, 450); };
  veil.onclick = (e) => { e.stopPropagation(); close(); };
  sh.addEventListener("click", (e) => e.stopPropagation());
  sh.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", close));
  sh.querySelectorAll(".chips").forEach((g) => g.addEventListener("click", (e) => { const c = e.target.closest(".chip"); if (!c) return; if (g.dataset.multi) c.classList.toggle("on"); else g.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === c)); }));
  sh.querySelectorAll(".sw").forEach((t) => t.addEventListener("click", () => t.classList.toggle("on")));
  // drag the handle down to dismiss
  let y0 = null; sh.addEventListener("pointerdown", (e) => { if (sh.scrollTop <= 0 && e.target.closest(".grab,h3")) y0 = e.clientY; });
  sh.addEventListener("pointerup", (e) => { if (y0 !== null && e.clientY - y0 > 60) close(); y0 = null; });
  if (onOpen) onOpen(sh, close);
  return sh;
};
