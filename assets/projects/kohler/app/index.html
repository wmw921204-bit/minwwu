  .scr.is-prev { visibility: visible; z-index: 1; }

  .scr.dim::after { opacity: 1; }
  .sc { position: absolute; left: 0; top: 0; width: 402px; height: 874px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }

  .page { position: relative; width: 402px; }

  .hs { position: absolute; border: 0; background: transparent; cursor: pointer; border-radius: 14px; z-index: 6; }
  .hs:focus-visible { outline: 2px solid #5fd6ca; outline-offset: 2px; }
  .hs:active { background: rgba(95,214,202,.12); }

  .pop { position: absolute; z-index: 61; transform: scale(.94); opacity: 0; transition: transform .3s cubic-bezier(.3,1.3,.5,1), opacity .2s; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
  .pop.is-on { transform: none; opacity: 1; }
  .pop img { display: block; width: 100%; border-radius: 14px; }
  .toast { position: absolute; left: 50%; bottom: 120px; z-index: 80; transform: translate(-50%, 14px); opacity: 0; max-width: 330px; padding: 11px 18px; border-radius: 22px; background: rgba(13,40,40,.94); border: 1px solid rgba(95,214,202,.3); color: #e8f6f4; font-size: 13px; line-height: 1.35; text-align: center; transition: .3s; pointer-events: none; width: max-content; }

  /* the brand intro is a swipeable carousel */

  .intro__t { display: flex; height: 100%; transition: transform .5s cubic-bezier(.25,.8,.25,1); }
  .intro__t img { flex: none; width: 402px; height: 874px; user-select: none; -webkit-user-drag: none; }

  .ring circle { fill: none; stroke: #f2fbfa; stroke-width: 5.5; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; filter: drop-shadow(0 0 6px rgba(255,255,255,.6)); }

const toast = (t) => { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("is-on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("is-on"), 2200); };
const btn = (h) => { const b = document.createElement("button"); b.className = "hs"; b.style.cssText = `left:${h.x}px;top:${h.y}px;width:${h.w}px;height:${h.h}px`; b.setAttribute("aria-label", h.label || h.go || h.act || "");
  b.addEventListener("click", (e) => { e.stopPropagation(); act(h); }); return b; };
const make = (id) => {
  if (els[id]) return els[id];
  const s = SCREENS[id], el = document.createElement("div");
  el.className = "scr" + (s.tab ? " tabbed" : ""); el.dataset.testid = "kh-" + id;
  if (s.intro) {
    el.innerHTML = `<div class="intro"><div class="intro__t">${[1, 2, 3, 4].map((i) => `<img src="${S("intro" + i)}" alt="" draggable="false">`).join("")}</div></div>`;
    bindIntro(el);
    s.hs.forEach((x) => el.append(btn(x)));
  } else {
    const sc = document.createElement("div"); sc.className = "sc";
    const page = document.createElement("div"); page.className = "page";
    const img = s.img || id, h = s.crop || (s.tab ? s.h - 110 : s.h);
    page.style.height = h + (s.pad || 0) + "px"; page.style.overflow = "hidden";
    page.innerHTML = `<img src="${S(img)}" alt="" draggable="false">`;
    // long pages keep their navigation header pinned, like an iOS nav bar
    const pin = s.top || (s.h > 874 && !s.tab ? 116 : 0);
    const fixed = (x) => x.fixed || (pin && x.back) || (pin && x.y < pin && x.y >= 54);
    s.hs.filter((x) => !x.tab && !fixed(x)).forEach((x) => page.append(btn(x)));
    if (s.sel) bindSel(s.sel, page, id);
    sc.append(page); el.append(sc);
    // pinned strips cut from the screen's own design: status bar / header on top, buttons below
    const strip = (cls, src, hh, pos) => { const d = document.createElement("div"); d.className = cls; d.style.cssText = `background-image:url(${S(src)});height:${hh}px;background-position:${pos}`; el.append(d); };
    if (pin) strip("top", img, pin, "0 0"); else if (s.h > 874) strip("top", img, 54, "0 0");
    if (s.foot) strip("bar", id, s.foot, "0 100%");
    s.hs.filter((x) => !x.tab && fixed(x)).forEach((x) => { const b = btn(x); b.style.zIndex = 7; el.append(b); });
    if (s.tab) {
      strip("bar", id, 110, "0 100%");
      BAR_HS.forEach((x) => { const b = btn(x); b.style.zIndex = 7; el.append(b); });
    }
    if (s.ring) el.insertAdjacentHTML("beforeend", `<svg class="ring" viewBox="0 0 340 340"><circle class="ring__track" cx="170" cy="170" r="166.5" style="stroke:#19333f;stroke-width:7;filter:none"/><circle cx="170" cy="170" r="166.5" pathLength="1000" stroke-dasharray="0 1000"/></svg>`);
    if (s.loader) el.insertAdjacentHTML("beforeend", `<i class="spin-loader"></i>`);
  }
  app.append(el); els[id] = el; return el;
};
/* tiles that toggle on and off independently: the selected look is cut from the design's selected state */
const bindSel = (sel, page, id) => {
  const on = new Set();
  const cut = (r) => { const d = document.createElement("div"); d.className = "cut"; d.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background-image:url(${S(sel.src)});background-position:${-r.x}px ${-r.y}px`; page.append(d); return d; };
  const go = sel.enable ? cut(sel.enable) : null; let goBtn = null;
  if (go) { goBtn = btn({ ...sel.enable, label: sel.enable.label || "Continue" }); goBtn.hidden = true; page.append(goBtn); }
  sel.items.forEach((r, i) => {
    const c = cut(r); const b = btn({ ...r, act: null, go: null });
    b.setAttribute("aria-pressed", "false");
    b.onclick = (e) => { e.stopPropagation(); on.has(i) ? on.delete(i) : on.add(i); c.classList.toggle("is-on", on.has(i)); b.setAttribute("aria-pressed", on.has(i));
      if (go) { go.classList.toggle("is-on", on.size > 0); goBtn.hidden = !on.size; } };
    page.append(b);
  });
};
const bindIntro = (el) => {
  const t = el.querySelector(".intro__t"), box = el.querySelector(".intro"); let i = 0, d = null, auto;
  const go = (n) => { i = (n + 4) % 4; t.style.transform = `translateX(${-402 * i}px)`; };
  const loop = () => { clearInterval(auto); auto = setInterval(() => { if (cur === "intro") go(i + 1); }, 3600); };
  box.addEventListener("pointerdown", (e) => { d = { x: e.clientX }; t.style.transition = "none"; });
  box.addEventListener("pointermove", (e) => { if (!d) return; t.style.transform = `translateX(${-402 * i + (e.clientX - d.x)}px)`; });
  const end = (e) => { if (!d) return; const dx = e.clientX - d.x; d = null; t.style.transition = ""; go(i + (dx < -50 ? 1 : dx > 50 ? -1 : 0)); loop(); };
  box.addEventListener("pointerup", end); box.addEventListener("pointercancel", end);
  loop();
};

/* ---------- navigation ---------- */
const show = (id, how = "push") => {
  const next = make(id), prev = cur && els[cur];
  if (prev === next) return;
  closePop(true);
  clearTimeout(autoTimer); stopRun();
  const sc = next.querySelector(".sc"); if (sc && how !== "none" && how !== "back") sc.scrollTop = 0;
  Object.values(els).forEach((e) => { if (e !== prev && e !== next) { e.className = e.className.replace(/ is-\w+| dim/g, ""); e.style.transform = ""; e.style.opacity = ""; } });
  const from = { push: ["translateX(100%)", "translateX(-28%)"], back: ["translateX(-28%)", "translateX(100%)"], fade: ["", ""], none: ["", ""], up: ["translateY(100%)", ""] }[how] || ["", ""];
  next.style.transition = "none"; next.style.transform = from[0]; next.style.opacity = how === "fade" ? 0 : 1;
  next.classList.add("is-cur"); next.classList.remove("is-prev", "dim");
  void next.offsetWidth; next.style.transition = ""; next.style.transform = ""; next.style.opacity = 1;
  next.style.zIndex = how === "back" ? 1 : ""; if (prev) prev.style.zIndex = how === "back" ? 3 : "";
  if (prev) { prev.classList.remove("is-cur"); prev.classList.add("is-prev"); if (how === "push" || how === "up") prev.classList.add("dim"); prev.style.transform = from[1]; if (how === "fade") prev.style.opacity = 0;
    const p = prev; setTimeout(() => { if (els[cur] !== p) { p.classList.remove("is-prev", "dim"); p.style.transform = ""; p.style.opacity = ""; p.style.zIndex = ""; } }, 460); }
  cur = id;
  const s = SCREENS[id];
  if (s.auto) autoTimer = setTimeout(() => { if (cur === id) show(s.auto[0], "none"); }, s.auto[1]);
  if (s.run !== undefined) startRun(id);
};
const act = (h) => {
  if (h.back) { show(stack.pop() || "today", "back"); return; }
  if (h.tab) { stack = []; show(TABS[h.tab], "fade"); return; }
  if (h.go) { if ((h.how || "push") !== "none") stack.push(cur); show(h.go, h.how || "push"); return; }
  if (h.act) actions[h.act](h);
};

/* ---------- popups ---------- */
let popEl = null, veilEl = null;
const openPop = (id) => {
  closePop(true);
  const p = POPS[id];
  veilEl = document.createElement("div"); veilEl.className = "veil"; veilEl.addEventListener("click", () => { if (id !== "paused") closePop(); });
  popEl = document.createElement("div"); popEl.className = "pop"; popEl.dataset.testid = "kh-ov-" + id;
  popEl.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;transform-origin:${p.light ? "100% 0" : "50% 50%"}`;
  popEl.innerHTML = `<img src="${S(p.img)}" alt="">`;
  p.hs.forEach((x) => popEl.append(btn(x)));
  if (p.light) veilEl.style.background = "rgba(0,5,7,.25)";
  app.append(veilEl, popEl);
  const v = veilEl, pe = popEl; requestAnimationFrame(() => { v.classList.add("is-on"); pe.classList.add("is-on"); });
};
const closePop = (now) => {
  const v = veilEl, p = popEl; veilEl = popEl = null;
  if (!p) return;
  if (now) { v.remove(); p.remove(); return; }
  v.classList.remove("is-on"); p.classList.remove("is-on"); v.style.pointerEvents = p.style.pointerEvents = "none"; setTimeout(() => { v.remove(); p.remove(); }, 300);
};

/* ---------- the ritual runs on its own: a ring sweeps each step, then the next step comes in ---------- */
const RUN = ["run0", "run1", "run2", "run3"], STEP_MS = [2600, 4200, 4200, 4200];
let runStart = 0, runLeft = 0;
const stopRun = () => { cancelAnimationFrame(runTimer); runTimer = 0; };
const startRun = (id) => {
  paused = false; runLeft = STEP_MS[SCREENS[id].run]; runStart = performance.now();
  const circle = els[id].querySelector(".ring circle:not(.ring__track)");
  const tick = (t) => {
    if (cur !== id) return;
    if (!paused) {
      const k = Math.min(1, 1 - (runLeft - (t - runStart)) / STEP_MS[SCREENS[id].run]);
      if (circle) circle.setAttribute("stroke-dasharray", `${(k * 1000).toFixed(1)} 1000`);
      if (t - runStart >= runLeft) { const i = SCREENS[id].run; show(i < 3 ? RUN[i + 1] : "done", "none"); return; }
    }
    runTimer = requestAnimationFrame(tick);
  };
  runTimer = requestAnimationFrame(tick);
};
const pauseRun = () => { if (paused) return; paused = true; runLeft -= performance.now() - runStart; };
const resumeRun = () => { if (!paused) return; paused = false; runStart = performance.now(); };

const actions = {
  terms: () => openPop("terms"),
  agree: () => { closePop(); stack.push(cur); show("wear"); },
  close: () => { if (popEl && popEl.dataset.testid === "kh-ov-stopask") resumeRun(); closePop(); },
  home: () => { stack = []; show("today", "fade"); },
  save: () => toast("Saved to My Rituals"),
  saveLater: () => { toast("Saved for later"); stack = []; show("rituals", "fade"); },
  soon: () => toast("Not part of this walkthrough"),
  start: () => { stack.push(cur); show("run0", "up"); },
  pause: () => { pauseRun(); openPop("paused"); },
  resume: () => { closePop(); resumeRun(); },
  stop: () => { pauseRun(); openPop("stopask"); },
  stopYes: () => { closePop(); stack = []; show("today", "fade"); toast("Ritual stopped. Progress saved."); },
  shared: () => toast("Link copied"),
  addpop: () => openPop("addpop"),
  smart: () => { closePop(); stack.push(cur); show("q5"); },
  toRituals: () => { stack = []; show("rituals", "back"); },
};

// the case-study page can restart the prototype
addEventListener("message", (e) => { if (e.data && e.data.type === "kohler-restart") { stack = []; show("intro", "fade"); } });
show("intro", "none");
</script>
