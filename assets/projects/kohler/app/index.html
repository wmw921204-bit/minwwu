  .intro__start { position: absolute; left: 24px; top: 706px; width: 354px; height: 76px; border-radius: 12px; z-index: 3; pointer-events: none; display: grid; place-items: center;
    background: rgba(214,222,218,.42); border: 1px solid rgba(255,255,255,.55); -webkit-backdrop-filter: blur(22px) saturate(1.1); backdrop-filter: blur(22px) saturate(1.1);
    font: 400 20px "Red Hat Display", system-ui, sans-serif; color: #fff; letter-spacing: .01em; }

  .breathe { animation: breathe 4s ease-in-out infinite; }

  /* searching: the orb breathes and sends out water rings */

  .search-fx b { position: absolute; left: 201px; top: 438px; width: 114px; height: 114px; margin: -57px 0 0 -57px; border-radius: 50%; background: radial-gradient(circle, #050c10 0%, #1b3b40 55%, #5d8e8c 100%); animation: orb 2.8s ease-in-out infinite; }

  box.querySelectorAll(".pcard").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); act({ go: "prod_" + ROOM_ADD[b.getAttribute("aria-label")] }); }));
  return roomAdded.length * 152;
});
/* Quick Start: shortcuts you add sit between Shower and Find More, and the row scrolls sideways once it is full */
const QS_ICON = {
  "Sauna": [`<path d="M4 20h16M6 20V9l6-5 6 5v11"/><path d="M10 13q1 1.5 0 3M14 13q1 1.5 0 3"/>`, "prod_sauna"],
  "Cold Plunge": [`<path d="M3 10h18v6a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M8 4l1.5 2.5M12 3v3M16 4l-1.5 2.5"/>`, "prod_icebath"],
  "Red Light": [`<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>`, "cap_redlight"],
  "Aromatherapy": [`<path d="M12 21c-4 0-6-3-6-6 0-4 6-9 6-12 0 3 6 8 6 12 0 3-2 6-6 6z"/>`, "cap_aroma"],
  "Hydrotherapy": [`<path d="M3 9q3-3 6 0t6 0 6 0M3 14q3-3 6 0t6 0 6 0M3 19q3-3 6 0t6 0 6 0"/>`, "cap_hydro"],
};
const quick = [];
const drawQuick = () => {
  const pg = make("today").querySelector(".page");
  let row = pg.querySelector(".qs");
  if (!row) {
    // the design's own two shortcuts are painted out with the background around them, then rebuilt live
    const cv = document.createElement("canvas"); cv.width = 804; cv.height = 192; cv.className = "patch"; cv.style.cssText = "left:0;top:196px;width:402px;height:96px;z-index:5";
    const im = new Image(); im.onload = () => {
      const c = cv.getContext("2d"), t = document.createElement("canvas"); t.width = 804; t.height = 200; const tc = t.getContext("2d"); tc.drawImage(im, 0, 388, 804, 200, 0, 0, 804, 200);
      const a = tc.getImageData(0, 0, 804, 1).data, z = tc.getImageData(0, 199, 804, 1).data, d = c.createImageData(804, 192);
      for (let y = 0; y < 192; y++) { const k = (y + 4) / 199; for (let x = 0; x < 804; x++) { const o = (y * 804 + x) * 4, q = x * 4; for (let ch = 0; ch < 3; ch++) d.data[o + ch] = a[q + ch] * (1 - k) + z[q + ch] * k; d.data[o + 3] = 255; } }
      c.putImageData(d, 0, 0); };
    im.src = S("today");
    row = document.createElement("div"); row.className = "qs";
    pg.append(cv, row);
    pg.querySelectorAll(".hs").forEach((b) => { if (["Shower quick start", "Find More"].includes(b.getAttribute("aria-label"))) b.hidden = true; });
  }
  const item = (n, icon) => `<button type="button" data-n="${n}" aria-label="${n}"><i>${svgI(icon)}</i><span>${n}</span></button>`;
  // Shower and Find More keep the design's own icons, cut from the screen
  const own = (n, cx) => `<button type="button" data-n="${n}" aria-label="${n}"><i style="border:0;background:url(${S("today")}) ${-(cx - 26)}px -204px/402px auto"></i><span>${n}</span></button>`;
  row.innerHTML = own("Shower", 49) + quick.map((n) => item(n, QS_ICON[n][0])).join("") + own("Find More", 148.5);
  row.querySelectorAll("button").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); const n = b.dataset.n; if (n === "Shower") act({ go: "shower" }); else if (n === "Find More") act({ tab: "learn" }); else act({ go: QS_ICON[n][1] }); }));
};

/* bottom sheets for things the design leaves to a follow-up screen */
let sheetEl = null;
const sheet = (html, wire) => {
  closeSheet(true);
  const v = document.createElement("div"); v.className = "veil"; v.style.zIndex = 69; v.onclick = () => closeSheet();
  const sh = document.createElement("div"); sh.className = "sheet"; sh.innerHTML = `<div class="grab"></div>` + html;
  app.append(v, sh); sheetEl = [v, sh]; requestAnimationFrame(() => { v.classList.add("is-on"); sh.classList.add("is-on"); });
  if (wire) wire(sh);
};
const closeSheet = (now) => { if (!sheetEl) return; const [v, sh] = sheetEl; sheetEl = null; if (now) { v.remove(); sh.remove(); return; } v.classList.remove("is-on"); sh.classList.remove("is-on"); setTimeout(() => { v.remove(); sh.remove(); }, 400); };
const chipSheet = (title, items, done, pre) => {
  if (!items.length) { toast("Everything is already added"); return; }
  sheet(`<h4>${title}</h4><div class="chips">${items.map((t) => `<button type="button"${pre && pre.includes(t) ? ' class="is-on"' : ""}>${t}</button>`).join("")}</div><button class="done" type="button">${pre ? "Save" : "Add"}</button>`, (sh) => {
    sh.querySelectorAll(".chips button").forEach((b) => (b.onclick = () => b.classList.toggle("is-on")));
    sh.querySelector(".done").onclick = () => { const picked = [...sh.querySelectorAll(".chips .is-on")].map((b) => b.textContent), n = picked.length; closeSheet(); toast(n || pre ? done(n, picked) : "Nothing added"); };
  });
};
const SEARCH = [["Muscle Recovery", "Wellness goal", "recovery"], ["Contrast Therapy", "Capability", "capability"], ["Hydrotherapy", "Capability", "capability"], ["Red Light Therapy", "Capability", "capability"], ["Aromatherapy", "Capability", "capability"], ["Programmable Thermal Shower", "Capability", "capability"], ["KOHLER Wellness Shower", "Product", "shower"]];
const actions = {
  otherSignin: () => sheet(`<h4>Other sign-in options</h4><div class="results"><button type="button">Continue with Facebook</button><button type="button">Continue with phone number</button></div>`, (sh) => sh.querySelectorAll(".results button").forEach((b) => (b.onclick = () => { closeSheet(true); openPop("terms"); }))),
  help: () => sheet(`<h4>Not seeing your device?</h4><p style="color:#9fb4ba;line-height:1.5">Make sure Bluetooth is on and your watch is awake and nearby, then search again.</p><button class="done" type="button">Search again</button>`, (sh) => (sh.querySelector(".done").onclick = () => { closeSheet(); show("wearsearch", "none"); })),
  addAsp: () => addTiles("asp0", "aspiration"),
  addFeeling: () => addTiles(cur, "feeling"),
  editQuick: () => chipSheet("Quick Start shortcuts", Object.keys(QS_ICON), (n, picked) => { quick.splice(0, quick.length, ...picked); drawQuick(); return "Quick Start updated"; }, quick),
  readMore: () => { const sc = els[cur].querySelector(".sc"); sc.scrollTo({ top: 980, behavior: "smooth" }); },
  editRitual: () => sheet(`<h4>Edit ritual</h4><div class="results"><button type="button">Warm shower <small>100°F · 10 min</small></button><button type="button">Cold shower <small>55°F · 2 min</small></button><button type="button">Rest <small>2 min</small></button></div><button class="done" type="button">Done</button>`, (sh) => (sh.querySelector(".done").onclick = () => closeSheet())),
  search: () => sheet(`<h4>Search</h4><input type="search" placeholder="Search goals, capabilities, products" autocomplete="off"><div class="results"></div>`, (sh) => {
    const inp = sh.querySelector("input"), res = sh.querySelector(".results");
    const draw = () => { const q = inp.value.trim().toLowerCase(); res.innerHTML = SEARCH.filter(([n]) => !q || n.toLowerCase().includes(q)).map(([n, k, go]) => `<button type="button" data-go="${go}">${n}<small>${k}</small></button>`).join("") || `<p style="color:#8aa3ab;padding:12px">No results</p>`;
      res.querySelectorAll("button").forEach((b) => (b.onclick = () => { closeSheet(); stack.push(cur); show(b.dataset.go); })); };
    inp.oninput = draw; draw(); setTimeout(() => inp.focus({ preventScroll: true }), 420);
  }),
  addProduct: () => chipSheet("Add a product", Object.keys(ROOM_ADD).filter((t) => !roomAdded.includes(t)), (n, picked) => { roomAdded.push(...picked); drawRoom(picked); return `${n} product${n > 1 ? "s" : ""} added to this room`; }),
  homes: () => sheet(`<h4>Homes</h4><div class="results"><button type="button">Home 1 <small>Current</small></button><button type="button">Lake House <small>2 rooms</small></button></div>`, (sh) => sh.querySelectorAll(".results button").forEach((b) => (b.onclick = () => closeSheet()))),
  rooms: () => toast("Master Bathroom is the only room set up so far"),
  private: (h) => toast(`${h.label}'s profile is private`),
  goalInfo: (h) => toast(`${h.label}: rituals for this goal are coming soon`),
  support: (h) => sheet(`<h4>${h.label}</h4><p style="color:#9fb4ba;line-height:1.5">Opens Kohler support for your Wellness Shower.</p><button class="done" type="button">Close</button>`, (sh) => (sh.querySelector(".done").onclick = () => closeSheet())),
  signOut: () => { stack = []; show("intro", "fade"); },
  addProfile: () => chipSheet("Who is joining?", ["Partner", "Child", "Parent", "Guest"].filter((t) => !invited.includes(t)), (n, picked) => { invited.push(...picked); drawInvites(picked); return n > 1 ? "Invites sent" : "Invite sent"; }),
  createOwn: () => { closePop(); stack.push(cur); show("ritual"); },
  presets: () => chipSheet("Save the current settings as", ["Morning Rinse", "Post-Workout", "Evening Wind-Down", "Weekend Reset"].filter((t) => !presets.includes(t)), (n, picked) => { presets.push(...picked); drawPresets(picked); return n > 1 ? "Presets saved" : "Preset saved"; }),
  editPresets: () => presets.length ? chipSheet("Keep these presets", presets.slice(), (n, picked) => { presets.splice(0, presets.length, ...picked); drawPresets([]); return "Presets updated"; }, presets.slice()) : actions.presets(),
  terms: () => openPop("terms"),
  agree: () => { closePop(); stack.push(cur); show("wear"); },
  close: () => { if (popEl && popEl.dataset.testid === "kh-ov-stopask") resumeRun(); closePop(); },
  home: () => { stack = []; show("today", "fade"); },
  save: () => toast("Saved to My Rituals"),
  saveLater: () => { toast("Saved to My Rituals"); stack = []; show("rituals", "fade"); },
  start: () => { stack.push(cur); show("run0", "up"); },
  startx: (h) => { stack.push(cur); runx = h.rit; show("runx", "up"); },
  pause: () => { pauseRun(); openPop("paused"); },
  resume: () => { closePop(); resumeRun(); },
  stop: () => { pauseRun(); openPop("stopask"); },
  stopYes: () => { closePop(); stack = []; show("today", "fade"); toast("Ritual stopped. Progress saved."); },
  shared: () => toast("Link copied"),
  addpop: () => openPop("addpop"),
  smart: () => { closePop(); stack.push(cur); show("q5"); },
  toRituals: () => { stack = []; show("rituals", "back"); },
};

// the case-study page can restart the prototype
addEventListener("message", (e) => { if (e.data && e.data.type === "kohler-restart") { stack = []; show("intro", "fade"); } });
show("intro", "none");
</script>
