<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>From Operator to Supervisor — robot vacuum prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E7EAF2; --bg:#F3F5FA; --surface:#FFFFFF; --glass:rgba(255,255,255,.74); --glass-line:rgba(255,255,255,.95);
  --ink:#10131F; --muted:#697085; --line:#E2E6EF;
  --primary:#2E44F2; --primary-ink:#FFFFFF; --primary-soft:#E7EAFE;
  --clean:rgba(46,68,242,.30); --clean2:rgba(46,68,242,.55);
  --warn:#9A5800; --warn-soft:#FFF1D6; --warn-line:#F2A93B;
  --ok:#17855A; --ok-soft:#DDF4E8;
  --stop:#CF4036; --stop-soft:#FDE5E2;
  --skip:#9AA1B2; --skip-soft:#EEF0F5;
  --plan:#DCE5F4; --wall:#FFFFFF; --floor:#F7F8FC;
  --r-living:#F8E4E8; --r-kitchen:#E3F1E1; --r-hall:#E8EEFA; --r-bed:#FBF0D5; --r-study:#E3E8FB;
  --blob1:rgba(46,68,242,.20); --blob2:rgba(64,200,230,.26); --blob3:rgba(214,140,230,.20);
  --shadow:0 14px 34px -20px rgba(24,34,90,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0A0C13; --bg:#10131C; --surface:#191D2A; --glass:rgba(27,31,45,.74); --glass-line:rgba(255,255,255,.06);
    --ink:#EEF0F7; --muted:#9BA2B7; --line:#272C3B;
    --primary:#7F8CFF; --primary-ink:#0A0C13; --primary-soft:#232A5E;
    --clean:rgba(127,140,255,.34); --clean2:rgba(127,140,255,.58);
    --warn:#F4BA5E; --warn-soft:#382B14; --warn-line:#C98A2A;
    --ok:#6FD3A0; --ok-soft:#173226; --stop:#F2877C; --stop-soft:#3C1F1D; --skip:#727A8E; --skip-soft:#232837;
    --plan:#141925; --wall:#39415A; --floor:#1C2130;
    --r-living:#2C2229; --r-kitchen:#1E2C24; --r-hall:#1E2536; --r-bed:#2E291B; --r-study:#20253D;
    --blob1:rgba(90,105,255,.20); --blob2:rgba(40,160,200,.14); --blob3:rgba(170,90,200,.14);
    --shadow:0 14px 34px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --page:#0A0C13; --bg:#10131C; --surface:#191D2A; --glass:rgba(27,31,45,.74); --glass-line:rgba(255,255,255,.06);
  --ink:#EEF0F7; --muted:#9BA2B7; --line:#272C3B;
  --primary:#7F8CFF; --primary-ink:#0A0C13; --primary-soft:#232A5E;
  --clean:rgba(127,140,255,.34); --clean2:rgba(127,140,255,.58);
  --warn:#F4BA5E; --warn-soft:#382B14; --warn-line:#C98A2A;
  --ok:#6FD3A0; --ok-soft:#173226; --stop:#F2877C; --stop-soft:#3C1F1D; --skip:#727A8E; --skip-soft:#232837;
  --plan:#141925; --wall:#39415A; --floor:#1C2130;
  --r-living:#2C2229; --r-kitchen:#1E2C24; --r-hall:#1E2536; --r-bed:#2E291B; --r-study:#20253D;
  --blob1:rgba(90,105,255,.20); --blob2:rgba(40,160,200,.14); --blob3:rgba(170,90,200,.14);
  --shadow:0 14px 34px -20px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input,select{font:inherit;color:inherit}
.display{font-family:"Barlow Condensed","Arial Narrow",Manrope,sans-serif}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:22px}
.phone{width:390px;height:844px;border-radius:48px;background:var(--bg);box-shadow:0 0 0 9px #11141C,0 40px 80px -30px rgba(20,30,80,.5);overflow:hidden;position:relative;flex:none}
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:radial-gradient(420px 320px at 8% 22%,var(--blob1),transparent 70%),radial-gradient(360px 280px at 100% 4%,var(--blob2),transparent 70%),radial-gradient(380px 300px at 80% 58%,var(--blob3),transparent 70%),var(--bg)}

.sbar{flex:none;height:48px;padding:14px 28px 0;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
.demo-chip{font-size:11px;font-weight:700;background:var(--glass);border:1px solid var(--glass-line);color:var(--warn);padding:3px 9px;border-radius:99px;backdrop-filter:blur(10px)}
.banner{flex:none;margin:6px 16px 0;padding:12px 14px;border-radius:18px;background:var(--stop-soft);color:var(--stop);font-size:13px;line-height:1.4;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner b{display:block;font-size:14px}
.banner.connecting{background:var(--primary-soft);color:var(--primary)}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 118px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.topbar{display:flex;align-items:center;gap:8px;min-height:50px;margin:0 -6px 4px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(12px);display:grid;place-items:center}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:1;text-align:center;padding-right:42px}
.h-screen{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:36px;font-weight:700;letter-spacing:-.005em;margin:8px 0 12px;line-height:1.02}
.page-title{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:40px;font-weight:700;line-height:1;margin:8px 0 14px}

.tabbar{position:absolute;left:16px;right:16px;bottom:18px;z-index:20;display:flex;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;padding:7px;box-shadow:var(--shadow)}
.tab{position:relative;flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:8px 0;border-radius:22px}
.tab.on{color:var(--primary-ink);background:var(--primary);box-shadow:0 8px 18px -8px var(--primary)}
.tab .dot{position:absolute;left:50%;top:6px;margin-left:8px;width:8px;height:8px;border-radius:50%;background:var(--warn-line);box-shadow:0 0 0 2px var(--surface)}

.card{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.sec-h{font-size:16px;font-weight:800;margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec-h small{font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.45}
p{margin:0}

.hero{position:relative;margin:0 -4px}
.hero-name{line-height:.95;margin:6px 2px 0}
.hero-name b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:46px;letter-spacing:-.01em}
.hero-name span{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:300;font-size:40px}
.hero-sub{font-size:13px;font-weight:600;color:var(--muted);margin:8px 2px 0;display:flex;gap:8px;align-items:center}
.iso{display:block;width:100%;max-width:330px;margin:4px auto -6px}
.iso .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.iso .fl{fill:var(--surface)}
.iso .gr{fill:none;stroke:var(--surface);stroke-width:2.5;opacity:.9}
.bubble{position:absolute;right:42px;top:112px;width:50px;height:50px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--primary)}
.bubble::after{content:"";position:absolute;bottom:-7px;left:14px;border:7px solid transparent;border-top-color:var(--surface);border-bottom:0}
.bubble.warn{color:var(--warn)}
.bubble.ok{color:var(--ok)}
.pulse{animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0}
.tile{border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(16px);border-radius:22px;padding:14px 8px 12px;text-align:center;box-shadow:var(--shadow);color:var(--ink)}
.tile .ti{display:grid;place-items:center;height:28px;color:var(--ink)}
.tile b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;margin-top:8px;line-height:1}
.tile span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px}
.tile.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.tile.on .ti,.tile.on span{color:var(--primary-ink)}
.tile.warn b{color:var(--warn)}
button.tile{font:inherit;width:100%}
#needs-you{scroll-margin-top:72px}

.status-kicker{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.live-dot.warn{background:var(--warn-line);box-shadow:0 0 0 4px var(--warn-soft)}
.live-dot.off{background:var(--skip);box-shadow:0 0 0 4px var(--skip-soft)}
.live-dot.stop{background:var(--stop);box-shadow:0 0 0 4px var(--stop-soft)}
.status-title{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:32px;font-weight:700;line-height:1.02;margin:10px 0 6px}
.status-sub{font-size:14px;color:var(--muted);line-height:1.45}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:14px 0 8px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#5E70FF,var(--primary));border-radius:99px;transition:width .3s}
.meta-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700}
.why-chip{display:flex;width:100%;align-items:center;gap:10px;border:0;background:var(--primary-soft);color:var(--ink);border-radius:16px;padding:12px 13px;margin-top:14px;text-align:left;font-size:13px;line-height:1.35}
.why-chip svg{color:var(--primary);flex:none}
.why-chip b{font-weight:700}
.why-chip .why{margin-left:auto;color:var(--primary);font-weight:800;white-space:nowrap}

.btn{height:52px;border-radius:99px;border:0;padding:0 20px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--primary);color:var(--primary-ink);box-shadow:0 12px 24px -12px var(--primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.plain{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.danger{background:var(--stop-soft);color:var(--stop)}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row>.btn{flex:1}
.link{border:0;background:none;color:var(--primary);font-weight:800;padding:0;font-size:inherit}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill.edit{background:var(--primary-soft);color:var(--primary)}
.pill.needsReview,.pill.deferred,.pill.partial{background:var(--warn-soft);color:var(--warn)}
.pill.inProgress,.pill.info{background:var(--primary-soft);color:var(--primary)}
.pill.resolved,.pill.completed{background:var(--ok-soft);color:var(--ok)}
.pill.skipped,.pill.ended{background:var(--skip-soft);color:var(--muted)}

.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.item+.item{margin-top:10px}
.item .body{flex:1;min-width:0}
.item .t,.item .s{display:block}
.item .t{font-weight:800;font-size:15px;line-height:1.3}
.item .s{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:600}
.item .ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.ico.ok{background:var(--ok-soft);color:var(--ok)}
.ico.blue{background:var(--primary-soft);color:var(--primary)}
.ico.gray{background:var(--skip-soft);color:var(--muted)}
.calm{padding:16px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(16px);font-size:14px;line-height:1.45;color:var(--muted);display:flex;gap:12px;align-items:flex-start}

.map-wrap{background:linear-gradient(160deg,var(--surface) -40%,var(--plan) 100%);border-radius:28px;padding:14px;position:relative;box-shadow:var(--shadow);overflow:hidden}
.map-wrap .map{transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-origin:50% 50%}
.map-wrap.tilt{padding:26px 6px 4px}
.map-wrap.tilt .map{transform:perspective(900px) rotateX(52deg) rotateZ(-32deg) scale(.84) translateY(-10px)}
.map-tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.map-tools button{width:40px;height:40px;border-radius:13px;border:0;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:12px;color:var(--ink)}
.map-tools button.on{background:var(--primary);color:var(--primary-ink)}
.map{display:block;width:100%;height:auto;overflow:visible}
.map .room{stroke:none}
.map .room.r-living{fill:var(--r-living)}.map .room.r-kitchen{fill:var(--r-kitchen)}.map .room.r-hall{fill:var(--r-hall)}.map .room.r-bed{fill:var(--r-bed)}.map .room.r-study{fill:var(--r-study)}
.map .room.dull{fill:var(--floor)}
.map .room.sel{fill:var(--primary-soft)}
.map .roomtap{fill:transparent;cursor:pointer}
.map .cell{stroke:none;pointer-events:none;transition:fill .25s}
.map .cell.out,.map .cell.todo{fill:transparent}
.map .cell.cleaned{fill:var(--clean)}
.map .cell.cleaned2{fill:var(--clean2)}
.map .cell.review{fill:url(#h-warn)}
.map .cell.skipped{fill:url(#h-skip)}
.map .cell.nogo{fill:url(#h-nogo)}
.map .furn{fill:var(--surface);stroke:none;pointer-events:none;filter:url(#soft)}
.map .furn2{fill:var(--bg);stroke:none;pointer-events:none}
.map .lbl{font-size:9.5px;font-weight:800;fill:var(--muted);pointer-events:none;font-family:Manrope,sans-serif}
.map .walls{fill:none;stroke:var(--wall);stroke-width:4;pointer-events:none}
.map .outer{fill:none;stroke:var(--wall);stroke-width:7;pointer-events:none;filter:url(#soft)}
.map .zone{fill:transparent;stroke-width:2;stroke-dasharray:4 3;cursor:pointer}
.map .zone.needsReview,.map .zone.deferred,.map .zone.inProgress{stroke:var(--warn-line)}
.map .zone.skipped{stroke:var(--skip)}
.map .zone.resolved,.map .zone.info{stroke:var(--ok)}
.map .zone.hl{stroke-width:3;stroke-dasharray:none}
.map .marker{cursor:pointer}
.robot{transition:transform .3s linear}
.map .trail{fill:none;stroke:var(--primary);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round;opacity:.45;pointer-events:none}
.map3d{width:100%;aspect-ratio:1/1.02;border-radius:22px;overflow:hidden;touch-action:none;cursor:grab;position:relative}
.map3d canvas{display:block;width:100%!important;height:100%!important}
.map3d .hint{position:absolute;left:10px;bottom:10px;font-size:11.5px;font-weight:800;color:var(--muted);background:var(--glass);padding:5px 9px;border-radius:99px;pointer-events:none}
.robot circle.body{fill:var(--surface);stroke:#C3CAD9;stroke-width:1.4;filter:url(#soft)}
.robot circle.eye{fill:var(--primary)}
.map.dim{opacity:.45;filter:grayscale(.6)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;font-weight:700;color:var(--muted);margin:12px 6px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}

.ev-art{position:relative;background:linear-gradient(160deg,var(--surface),var(--plan));border-radius:28px;padding:18px 12px 12px;box-shadow:var(--shadow)}
.ev-art .art{display:block;width:100%;height:auto}
.ev-loc{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:5px;border:0;background:var(--glass);backdrop-filter:blur(10px);border-radius:99px;padding:6px 11px 6px 9px;font-size:12px;font-weight:800;color:var(--ink)}
.ev-line{font-size:16px;line-height:1.45;color:var(--muted);margin:-4px 2px 0}
.obj-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;border-radius:24px;background:linear-gradient(160deg,var(--surface),var(--plan))}
.obj-hero>span:first-child{font-size:54px;line-height:1}
.obj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.obj-opt{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:800}
.obj-opt span{font-size:22px}
.obj-opt.on{box-shadow:inset 0 0 0 2px var(--primary);background:var(--primary-soft);color:var(--primary)}
.map .obj{cursor:pointer}
.ex-demo{margin-top:14px;padding:14px 14px 12px}
.ex-row{display:flex;align-items:center;gap:6px}
.ex-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.ex-col:first-child{flex:1.5}
.ex-svg{display:block;width:100%;height:92px}
.ex-svg.ph{height:96px}
.ex-arrow{color:var(--muted);flex:none;margin-top:-26px}
.ex-cap{text-align:center;font-size:12.5px;font-weight:700;line-height:1.3;margin-top:6px}
.ex-cap .who{display:block;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.ex-cap .who.you{color:var(--primary)}
.radio.lp{display:block;padding:13px 15px}
.radio.lp+.radio.lp{margin-top:8px}
.lp-head{display:flex!important;align-items:center;gap:10px;margin:0!important;color:var(--ink)!important}
.lp-head .rd{margin:0}
.lp-head b{white-space:nowrap}
.lp-head .pill{font-size:11px;padding:3px 8px}
.lp-head .lvl{margin:0 0 0 auto!important;flex:none}
.lp-head .lvl i{width:13px}
.lp-desc{display:block;font-size:13px;color:var(--muted);margin:6px 0 0 30px!important;line-height:1.4}
.lp-step{display:flex;flex-direction:column;gap:4px;min-width:0}
.lp-svg{width:100%;height:62px;display:block}
.lp-cap{font-size:12px;font-weight:700;line-height:1.3;color:var(--ink)!important;margin:0!important}
.lp-cap span{display:block!important;font-size:10.5px;font-weight:800;color:var(--muted)!important;margin:0!important}
.lp-step.you .lp-cap span{color:var(--primary)!important}
.mini{border-radius:14px;padding:9px 10px;font-size:11.5px;line-height:1.3;margin:0!important;display:block!important;color:var(--ink)!important}
.mini .mini-t{display:flex!important;gap:5px;align-items:center;font-weight:800;font-size:12.5px;margin:0!important;color:inherit!important}
.mini .mini-s{display:block!important;font-size:11px;color:var(--muted)!important;margin:2px 0 0!important}
.mini-btns{display:flex!important;gap:5px;margin-top:7px!important}
.mini-btns span{display:inline-block!important;flex:1;text-align:center;padding:5px 4px;border-radius:99px;font-size:11px;font-weight:800;background:var(--surface);color:var(--ink)!important;margin:0!important;box-shadow:inset 0 0 0 1px var(--line)}
.mini-btns span.p{background:var(--primary);color:var(--primary-ink)!important;box-shadow:none}
.mini-wait{background:var(--warn-soft)}
.mini-wait .mini-t{color:var(--warn)!important}
.mini-sug{background:var(--primary-soft)}
.mini-note{background:var(--surface);box-shadow:0 6px 16px -8px rgba(20,30,80,.35),inset 0 0 0 1px var(--line)}
.mini-ic{display:grid!important;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--primary-soft);color:var(--primary)!important;flex:none;margin:0!important}
.mini-note .mini-t{font-size:11.5px}
.mini-chg{font-size:10.5px;font-weight:800;color:var(--primary)!important;margin:0!important;display:block!important}

<script>
/* ============ geometry ============ */
const CELL=20;
const ROOMS=[
  {id:'hall',name:'Hallway',the:'the hallway',x:9,y:5,w:7,h:2},
  {id:'kitchen',name:'Kitchen',the:'the kitchen',x:9,y:0,w:7,h:5},
  {id:'living',name:'Living room',the:'the living room',x:0,y:0,w:9,h:7},
  {id:'study',name:'Study',the:'the study',x:8,y:7,w:8,h:6},
  {id:'bed',name:'Bedroom',the:'the bedroom',x:0,y:7,w:8,h:6},
];
const ROOM=Object.fromEntries(ROOMS.map(r=>[r.id,r]));
const DOCK={c:15,r:6};
const K=(c,r)=>c+','+r, P=k=>k.split(',').map(Number);
const CELLROOM={}, ROOMCELLS={};
ROOMS.forEach(rm=>{
  const out=[];
  for(let j=0;j<rm.h;j++){
    const r=rm.id==='hall'?rm.y+rm.h-1-j:rm.y+j;
    const cols=[...Array(rm.w)].map((_,i)=>rm.x+i);
    if(rm.id==='hall'?j%2===0:j%2===1) cols.reverse();
    cols.forEach(c=>{const k=K(c,r);out.push(k);CELLROOM[k]=rm.id});
  }
  ROOMCELLS[rm.id]=out;
});
const ALLKEYS=ROOMS.flatMap(r=>ROOMCELLS[r.id]);
const ZONES={
  sofa:{name:'Near the sofa',room:'living',cells:[[6,5],[7,5],[6,6],[7,6]]},
  rug:{name:'Hallway patch',room:'hall',cells:[[10,5],[11,5]]},
  bed:{name:'Under the bed',room:'bed',cells:[[4,10],[5,10],[6,10],[4,11],[5,11],[6,11]]},
  stove:{name:'By the stove',room:'kitchen',cells:[[12,0],[13,0],[14,0],[12,1],[13,1],[14,1]]},
  table:{name:'Around the dining table',room:'kitchen',cells:[[10,2],[11,2],[12,2],[10,3],[11,3],[12,3],[10,4],[11,4],[12,4]]},
  entry:{name:'Entryway',room:'hall',cells:[[13,5],[14,5],[13,6],[14,6]]},
};
Object.values(ZONES).forEach(z=>z.keys=z.cells.map(([c,r])=>K(c,r)));

/* ============ event definitions ============ */
const OPT={
  avoid:{label:'Avoid this spot',sub:'The robot leaves it alone for this cleaning.'},

  skipNow:{label:'Skip this time',sub:'Accept that this spot stays uncleaned today.'},
  nogo:{label:'Mark as no-go zone',sub:'The robot stays out of it in every cleaning.'},

  asRug:{label:'Treat as rug',sub:'Vacuum only, no mopping.'},
  asHard:{label:'Treat as hard floor',sub:'Vacuum and mop.'},
  allow:{label:'Keep the extra pass',sub:'Adds about a minute.'},
  skipOnce:{label:'Skip the extra pass',sub:'Only for this cleaning.'},
};
const DEFS={
  cable:{type:'obstacle',zone:'sofa',kind:'Possible obstacle',title:'Possible cable near the sofa',chip:'Skipped a spot near the sofa',
    what:'The robot saw something thin on the floor at the end of the sofa and stopped short of it.',
    why:"It looks like it could be a cable. Cables can wrap around the brush, so the robot doesn't drive over things it isn't sure about.",
    unsure:'Not sure if this is a cable, a shadow, or a toy.',
    next:'It skipped this spot and is cleaning the rest of the living room.',
    dflt:'This area will remain skipped while the robot cleans elsewhere.',
    options:['avoid','retryCleared','later'],retryControlled:true,snapshot:'cable',
    basis:'The front camera saw a thin line about 30 cm long. It was 62% sure it is a cable; below 80% it asks instead of driving over.',
    failWhy:'Still detecting a thin object about 30 cm long in the same place.',failNext:'If it is a cable, move it and try once more. Otherwise leave this spot for today.',
    remember:{avoid:{text:'Avoid possible cables near the sofa',scope:'Living room, near the sofa. Other rooms still ask.'}}},
  rug:{type:'rug',zone:'rug',kind:'Floor type unclear',title:'Not sure about this floor',chip:'Left a hallway patch for now',
    what:'The robot found a surface in the hallway that it hasn’t mapped before.',
    why:"It can't tell whether this is a thin rug or hard floor. Mopping a rug would soak it.",

  bed:{type:'nav',zone:'bed',kind:'Navigation issue',title:"Couldn't get under the bed",chip:'Gave up on the area under the bed',

    why:'Something near the bed frame keeps blocking the way in. It may be a low object on the floor, or the gap may be too tight.',
    unsure:null,
    next:'It stopped trying and is finishing the rest of the bedroom.',
    dflt:'This area stays marked as not cleaned.',
    options:['retry','cleanLater','skipNow','nogo','pauseCheck'],retryControlled:true,snapshot:'bed',
    basis:'The bumper hit the bed frame 3 times at about 8 cm high before it reached the gap.',
    failWhy:'The gap under the bed frame looks about 8 cm high. The robot needs about 9.5 cm to get in.',failNext:'Clear what’s in front of the gap, or skip this area. A no-go zone stops it trying every time.'},
  extra:{type:'decision',zone:'stove',kind:'Robot decision',title:'Extra pass by the stove',chip:'Extra pass by the stove',
    what:'The robot is going over the area by the stove a second time.',
    why:'It picked up more debris there than usual on the first pass.',
    unsure:null,
    next:'After the extra pass it moves on. This adds about a minute.',

    options:['allow','skipOnce'],basis:'The dirt sensor read about 2× the usual level for this spot on the first pass.',
    remember:{skipOnce:{text:'Skip extra passes in the kitchen',scope:'Kitchen only. The robot still does one normal pass.'}}},
};
const SCEN={
  normal:{label:'Normal run',keys:['extra']},
  obstacle:{label:'Uncertain obstacle',keys:['rug','cable']},
  missed:{label:'Missed area',keys:['bed']},
  all:{label:'All events',keys:['rug','extra','cable','bed']},
};
const STATUSLABEL={needsReview:'Needs review',inProgress:'In progress',resolved:'Resolved',deferred:'Clean later',skipped:'Skipped',info:'Robot decided'};
const RESULTLABEL={completed:'Completed',partial:'Partially completed',ended:'Ended early'};
const MODES={
  manual:{name:'Manual',d:'You decide everything. The robot stops and waits whenever it’s unsure.',lvl:1,ex:'Robot stops and waits for you.',note:'You get a notice for every event, and it waits for you.'},
  assist:{name:'Assist',d:'The robot keeps going and suggests what to do. You confirm.',lvl:2,ex:'Robot skips it for now and suggests “Leave it”. You tap OK.',note:'You get a notice when it suggests something.'},
  autoNotify:{name:'Auto + notify',d:'The robot decides and tells you. You can change any decision.',lvl:3,ex:'Robot leaves it alone and tells you. You can change it.',note:'You get a notice for each decision, and can change it.'},

    if(!sim.queue.some(x=>x.kind==='extra')){const ev=S.events.find(e=>e.id===it.ev);if(ev&&ev.status==='info'){ev.outcome='Extra pass done by the stove.';commit()}}
  }else{
    if(S.cells[it.k]==='todo')setCell(it.k,'cleaned');
    const sp=SPAWNS.find(x=>x.k===it.k);
    if(sp&&!S.objects.some(o=>o.k===sp.k)){
      const o={id:'o'+(++seq),k:sp.k,label:sp.label,orig:sp.label,conf:sp.conf,guesses:sp.guesses||[],status:sp.conf==='sure'?'auto':'pending',at:S.clock};
      S.objects.push(o);
      tl('robot',sp.conf==='sure'?`Recognized ${OBJ[sp.label].n.toLowerCase()} in ${ROOM[CELLROOM[sp.k]].the} and went around it`:`Something small in ${ROOM[CELLROOM[sp.k]].the}. Not sure what it is. Will ask after cleaning`);
      commit();
    }
    const rm=CELLROOM[it.k];
    if(rm==='kitchen'&&sim.pending.includes('extra')&&!sim.queue.some(x=>x.kind==='normal'&&CELLROOM[x.k]==='kitchen')){fire('extra');commit()}
  }
  if(S.device.battery>20&&Math.random()<.13)S.device.battery--;
  if(!sim.queue.length&&sim.hold===0)finishRun();
}
function finishRun(){
  if(S.device.status!=='cleaning')return;
  S.device.status='returning';S.sim.msg=null;
  tl('robot','Returning to dock');
  const rt=route(K(S.sim.pos.c,S.sim.pos.r),K(DOCK.c,DOCK.r))||[K(DOCK.c,DOCK.r)];
  S.sim.path=rt.slice(1);
  commit();
}
function stepReturn(){
  if(stepMove())return;
  (()=>{
    S.device.status='docked';
    if(!S.task.done){
      S.task.done=true;S.task.end=S.clock;S.task.result=computeResult();
      const nc=S.events.filter(e=>e.status!=='resolved'&&e.status!=='info'&&DEFS[e.key].type!=='decision').length;
      if(S.notif.finished)banner(pendingObjs().length?'objs':'done',{id:'done',title:'Cleaning finished',body:RESULTLABEL[S.task.result]});
      if(!S.task.endedEarly&&S.ctl.scenario==='all'&&!S.mapNewsShown){ // the demo's moved-furniture moment
        S.mapNewsShown=true;S.mapLabel='today '+hhmm(S.clock);S.mapNews='Furniture moved in the bedroom';tl('robot','Furniture moved in the bedroom. Map updated');
        if(S.ui.notice)S.bannerNext='moved';else banner('moved',{id:'moved',title:'Map updated',body:'Furniture moved in the bedroom.'})}
      tl('result',S.task.result==='completed'?'Task completed':S.task.result==='ended'?'Task ended early':`Task partially completed: ${nc} area${nc===1?'':'s'} not cleaned`);
    }else{
      S.task.result=S.task.endedEarly?'ended':computeResult();
      tl('robot','Back on the dock');
    }
    commit();
  })();
}
function startRetry(ev,outcomeText){
  const keys=ZONES[DEFS[ev.key].zone].keys;
  const items=keys.map((k,i)=>({k,kind:'retry',ev:ev.id,first:i===0,last:i===keys.length-1}));
  ev.retryControlled=DEFS[ev.key].retryControlled;
  ev.willFail=ev.retryControlled&&!ev.retryFails&&Math.random()<.5;ev.retryTries=(ev.retryTries||0)+1;ev.pendingOutcome=outcomeText||null;
  ev.status='inProgress';
  if(S.task.done||S.device.status==='docked'){
    S.sim.queue=items;S.device.status='cleaning';
    tl('robot','Spot clean started: '+ZONES[DEFS[ev.key].zone].name,ev.id);
  }else{
    S.sim.queue.unshift(...items);
  }
}

/* ============ commands ============ */
function command(label,done,fn){
  if(S.conn!=='connected'){flash("You're offline. Reconnect to send commands.");return}
  S.cmd={label,state:'sending'};commit();
  setTimeout(()=>{
    if(S.ctl.failNext||Math.random()<0.08){S.ctl.failNext=false;S.cmd={label,state:'failed',retry:()=>command(label,done,fn)};commit();renderPanel();return}
    fn();if(S.undoNext){const u=S.undoNext;S.undoNext=null;offerUndo(u.ev,u.act,u.snap,done);commit();return}S.cmd={label:done,state:'confirmed'};commit();
    setTimeout(()=>{if(S.cmd&&S.cmd.state==='confirmed'){S.cmd=null;commit()}},1700);
  },850);
}
function flash(text){S.cmd={label:text,state:'info'};commit();setTimeout(()=>{if(S.cmd&&S.cmd.state==='info'){S.cmd=null;commit()}},2200)}

/* ============ event actions ============ */
function applyAction(ev,act,byRule){
  const d=DEFS[ev.key], z=ZONES[d.zone];
  ev.lastAct=act;
  const who=byRule?'robot':'you';
  const say=(y,r)=>evLog(ev,who,byRule==='auto'?`Decided on its own: ${SHORT[ev.key].labels[act]}`:byRule?(r||y):y);
  switch(act){
    case 'avoid':
      ev.status='skipped';ev.outcome=byRule?'Avoided using your saved preference.':'You chose to avoid this spot for this cleaning.';
      z.keys.forEach(k=>{if(S.cells[k]==='review')setCell(k,'skipped')});
      if(byRule)ev.autonomous=true;
      say('You chose to avoid this spot','Avoided the spot using your saved preference');break;
    case 'later':case 'cleanLater':
      ev.status='deferred';ev.outcome='On your list to clean later.';
      say('You chose to clean this later');break;
    case 'skipNow':
      ev.status='skipped';ev.outcome='Skipped for this cleaning. It is not counted as cleaned.';
      z.keys.forEach(k=>{if(S.cells[k]==='review')setCell(k,'skipped')});
      say('You chose to skip this time');break;
    case 'retry':case 'retryCleared':
      say(act==='retryCleared'?'You cleared the spot and asked for a retry':'You asked the robot to retry');
      startRetry(ev);break;
    case 'asRug':
      say('You said it is a rug');startRetry(ev,'Cleaned as a rug, vacuum only.');break;
    case 'asHard':
      say('You said it is hard floor');startRetry(ev,'Cleaned as hard floor.');break;
    case 'nogo':
      ev.status='resolved';ev.outcome='Marked as a no-go zone. The robot will stay out of it.';
      z.keys.forEach(k=>setCell(k,'nogo'));
      if(!S.nogo.includes(d.zone))S.nogo.push(d.zone);
      say('You marked this area as a no-go zone');
      if(S.task.done)S.task.result=computeResult();break;
    case 'pauseCheck':
      S.device.status='paused';S.checkEv=ev.id;
      say('You paused cleaning to check the robot');break;
    case 'allow':
      if(ev.suggest&&ev.status==='needsReview'){queueExtra(ev);ev.status='info';ev.outcome=null;say('You allowed the extra pass')}
      else{ev.acked=true;say('You kept the extra pass')}
      break;
    case 'skipOnce':
      S.sim.queue=S.sim.queue.filter(x=>x.kind!=='extra');
      ev.status='skipped';ev.outcome='Extra pass skipped for this cleaning.';
      say('You skipped the extra pass this time','Skipped the extra pass (your saved preference)');break;
  }
  if(byRule==='auto'){ev.autonomous=true;ev.autoChoice=act;if(AUTOOUT[act])ev.outcome=AUTOOUT[act]}
  else if(!byRule){
    if(ev.autonomous)ev.changed=true;
    if(S.waitEv===ev.id&&act!=='pauseCheck'){S.waitEv=null;if(S.device.status==='paused'){S.device.status='cleaning';tl('robot','Continuing the cleaning')}}
  }
}
const NEEDS_DEVICE={avoid:1,retry:1,retryCleared:1,asRug:1,asHard:1,nogo:1,pauseCheck:1,skipOnce:1,allow:1};
const CMDTEXT={avoid:['Avoid spot','Spot will be avoided'],retry:['Retry area','Retry sent'],retryCleared:['Retry area','Retry sent'],asRug:['Clean as rug','Sent'],asHard:['Clean as hard floor','Sent'],nogo:['Save no-go zone','No-go zone saved'],pauseCheck:['Pause','Paused'],skipOnce:['Skip extra pass','Extra pass skipped'],allow:['Keep extra pass','Confirmed']};
/* A choice you made can be changed later: undo what it did to the area first. */
function resetForChange(ev,act){
  if(!ev.lastAct||ev.lastAct===act||!['skipped','deferred','resolved'].includes(ev.status))return;
  const zk=ZONES[DEFS[ev.key].zone].keys;
  if(ev.lastAct==='nogo')S.nogo=S.nogo.filter(z=>z!==DEFS[ev.key].zone);
  zk.forEach(k=>{if(['skipped','nogo'].includes(S.cells[k]))setCell(k,'review')});
  if(DEFS[ev.key].type!=='decision')ev.status='needsReview';
  evLog(ev,'you','You changed your choice');
}
/* Everything one choice can touch, so Undo can put it back. */
function snapFor(ev){return {ev:JSON.parse(JSON.stringify(ev)),cells:{...S.cells},nogo:[...S.nogo],rules:S.rules.map(r=>({...r})),queue:JSON.parse(JSON.stringify(S.sim.queue)),
  status:S.device.status,waitEv:S.waitEv,checkEv:S.checkEv,tl:S.timeline.length,task:S.task?{...S.task}:null}}
function offerUndo(ev,act,snap,label){
  S.undo={ev:ev.id,snap};S.cmd={label:label||('You chose “'+((SHORT[ev.key]&&SHORT[ev.key].labels[act])||act)+'”'),state:'undo'};
  clearTimeout(offerUndo.t);offerUndo.t=setTimeout(()=>{if(S.cmd&&S.cmd.state==='undo'){S.cmd=null;S.undo=null;commit()}},6000);
}
function doAction(ev,act,saveRule){
  if(!ev.archived){S.ui.stack=[];S.ui.tab='map';S.ui.scrollTop=0;forceTop=true}
  const snap=snapFor(ev);
  const run=()=>{resetForChange(ev,act);applyAction(ev,act,false);if(saveRule){const r=DEFS[ev.key].remember[act];S.rules.push({id:'r'+(++seq),key:ev.key,act,text:r.text,scope:r.scope})}};
  if(NEEDS_DEVICE[act]){const [l,d]=CMDTEXT[act];command(l,d,()=>{run();S.undoNext={ev,act,snap}})}
  else{run();offerUndo(ev,act,snap);commit()}
}

  if(!T3.built)return;
  const col={cleaned:[cssv('--primary'),.28],cleaned2:[cssv('--primary'),.5],review:['#F2A93B',.55],skipped:['#9AA1B2',.5],nogo:['#D2433A',.45]};
  ALLKEYS.forEach(k=>{const m=T3.cellM[k];const v=col[S.cells[k]];if(v){m.material.color.set(v[0]);m.material.opacity=v[1]}else m.material.opacity=0});
  const pts=(S.sim.trail||[]).map(([c,r])=>new THREE.Vector3(c+.5,.03,r+.5));T3.trailGeo.setFromPoints(pts.length?pts:[new THREE.Vector3(),new THREE.Vector3()]);
  if(!full)return;
  T3.markers.forEach(m=>T3.root.remove(m));T3.markers=[];
  if(!T3.labels){T3.labels=ROOMS.map(r=>{const t=textSprite(r.name);t.position.set(r.x+r.w/2,1.25,r.y+.7);T3.root.add(t);return t})}
  visibleObjs().forEach(o=>{const [c,r]=P(o.k);const sp=emojiSprite(OBJ[o.label].e,o.status==='pending'?'#F2A93B':o.status==='auto'?cssv('--primary'):'#17855A',o.status==='pending'?'?':o.status==='auto'?null:'ok');sp.scale.set(.85,.85,1);sp.position.set(c+.5,.75,r+.5);sp.userData={obj:o.id};T3.root.add(sp);T3.markers.push(sp)});
  visibleEvents().forEach(ev=>{const d=DEFS[ev.key];if(d.type==='decision')return;const z=ZONES[d.zone];const cx=z.cells.reduce((a,c)=>a+c[0],0)/z.cells.length+.5,cz=z.cells.reduce((a,c)=>a+c[1],0)/z.cells.length+.5;
    const sp=emojiSprite(ev.status==='resolved'?'✓':ev.status==='skipped'?'–':'!',ev.status==='resolved'?'#17855A':ev.status==='skipped'?'#9AA1B2':'#F2A93B',null);sp.scale.set(.8,.8,1);sp.position.set(cx,1.25,cz);sp.userData={ev:ev.id};T3.root.add(sp);T3.markers.push(sp)});
}
function pick3D(e){
  const rc=T3.R.domElement.getBoundingClientRect();const v=new THREE.Vector2((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);
  const ray=new THREE.Raycaster();ray.setFromCamera(v,T3.cam);const hit=ray.intersectObjects(T3.markers)[0];
  if(!hit)return;const u=hit.object.userData;if(u.obj)A.openObj(u.obj);else if(u.ev)A.openEvent(u.ev);
}
function mount3D(){
  const host=document.getElementById('map3d-host');
  if(!host){T3.mounted=false;return}
  if(!build3D())return;
  host.prepend(T3.R.domElement);T3.mounted=true;
  const w=host.clientWidth,h=host.clientHeight;T3.R.setSize(w,h,false);T3.cam.aspect=w/h;T3.cam.updateProjectionMatrix();
  sync3D(true);
  if(!T3.loop){T3.cur={x:S.sim.pos.c+.5,z:S.sim.pos.r+.5,h:S.sim.heading};
    const tick=()=>{T3.loop=requestAnimationFrame(tick);if(!T3.mounted||!document.body.contains(T3.R.domElement))return;
      const tx=S.sim.pos.c+.5,tz=S.sim.pos.r+.5;const sp=Math.min(1,.06*S.ctl.speed*2.2);
      const dx=tx-T3.cur.x,dz=tz-T3.cur.z,dd=Math.hypot(dx,dz);if(dd>3){T3.cur.x=tx;T3.cur.z=tz}else if(dd>0){const st=Math.min(dd,.055*S.ctl.speed);T3.cur.x+=dx/dd*st;T3.cur.z+=dz/dd*st}
      T3.cur.h+=(S.sim.heading-T3.cur.h)*sp;
      T3.robot.position.set(T3.cur.x,0,T3.cur.z);T3.robot.rotation.y=-(T3.cur.h)*Math.PI/180;
      T3.cam.position.set(Math.sin(T3.az)*Math.cos(T3.el)*T3.dist,Math.sin(T3.el)*T3.dist,Math.cos(T3.az)*Math.cos(T3.el)*T3.dist);T3.cam.lookAt(0,0,0);
      T3.R.render(T3.sc,T3.cam)};
    tick();}
}

/* ============ actions ============ */
const A={
  panelToggle(){document.getElementById('panel').classList.toggle('open')},
  openObj(v){S.ui.objId=v;S.ui.objSel=null;S.ui.objCustom='';S.ui.objQueue=null;S.ui.modal=objModal(v);commit()},
  askLater(v){const [id,m]=v.split('|');const ev=findEvent(id);if(!ev)return;
    ev.later=m==='task'?{task:S.task&&S.task.id}:{until:nowT()+(+m)*(realTime()?60000:60)};ev.reminded=false;
    evLog(ev,'you',m==='task'?'You asked to be reminded after this cleaning':'You asked to be reminded in '+(m==='60'?'1 hour':m+' minutes'));
    if(S.waitEv===ev.id){if(window.HA_LIVE&&window.onAskLaterResume)window.onAskLaterResume();else{S.waitEv=null;S.device.status='cleaning';tl('robot','Carrying on. It will ask again later',ev.id)}}

  pauseNotif(){if(quietNow())S.quietUntil=nowT()-1;else S.quietUntil=nowT()+(realTime()?3600e3:3600);checkReminders();commit()},
  timeReal(){S.timeReal=!S.timeReal;commit()},
  lockShow(){S.ui.away=true;S.lockNotes=[];S.ui.modal=null;S.ui.notice=null;commit()},
  lockBack(){S.ui.away=false;commit()},
  lockOpen(v){S.ui.away=false;S.ui.modal=null;S.ui.stack=[];
    if(v==='done'&&S.task){S.ui.tab='activity';go('report',S.task.id);return}
    if(v==='moved'){A.tab('map');return}
    if(v==='stuck'){A.tab('home');return}
    if(findEvent(v)){S.ui.tab='home';go('event',v);return}
    commit()},
  updateMap(){if(running()){flash('The map updates while the robot cleans.');return}
    S.ui.modal={title:'Update the map?',body:'<p>The robot drives through every room without cleaning and scans them again with its laser. It takes about 6 minutes. Do this after moving furniture.</p>',buttons:[{label:'Start scanning',a:'updateMapGo',cls:'primary'},{label:'Cancel',a:'closeModal'}]};commit()},
  updateMapGo(){S.ui.modal=null;command('Update map','Rooms scanned. Map updated',()=>{S.mapLabel='today '+hhmm(S.clock);S.mapNews=null})},
  undoAct(){const u=S.undo;if(!u)return;const ev=findEvent(u.ev),s=u.snap;if(!ev)return;
    Object.keys(ev).forEach(k=>{if(!(k in s.ev))delete ev[k]});Object.assign(ev,JSON.parse(JSON.stringify(s.ev)));
    S.cells=s.cells;dirtyAll();S.nogo=s.nogo;S.rules=s.rules;S.sim.queue=s.queue;S.device.status=s.status;S.waitEv=s.waitEv;S.checkEv=s.checkEv;S.timeline.length=s.tl;
    if(S.task&&s.task)Object.assign(S.task,s.task);
    tl('you','You undid your last choice',ev.id);S.undo=null;S.cmd={label:'Undone',state:'confirmed'};commit();
    setTimeout(()=>{if(S.cmd&&S.cmd.state==='confirmed'){S.cmd=null;commit()}},1500)},
  modeSheet(){S.ui.sheet={mode:S.autonomy,for:'always'};S.ui.modal=modeModal();commit()},
  sheetMode(v){S.ui.sheet.mode=v;S.ui.modal=modeModal();commit()},
  sheetFor(v){S.ui.sheet.for=v;S.ui.modal=modeModal();commit()},
  sheetApply(){const {mode,for:f}=S.ui.sheet;S.ui.modal=null;
    if(f==='always'){if(S.temp&&S.temp.notif)S.notif={...S.notif,...S.temp.notif};S.temp=null;S.autonomy=mode;levelNotif(mode);flash(MODES[mode].name)}
    else{const live=realTime();S.temp={prev:S.temp?S.temp.prev:S.autonomy,notif:S.temp?S.temp.notif:{...S.notif},live,until:f==='1h'?nowT()+(live?3600e3:3600):null,task:f==='task'&&S.task?S.task.id:null};
      S.autonomy=mode;levelNotif(mode);flash(MODES[mode].name+(f==='1h'?' for 1 hour':' until this cleaning ends')+'. Then back to '+MODES[S.temp.prev].name)}
    commit()},
  reviewRoom(v){S.ui.notice=null;const m=groupModal(v);if(m){S.ui.modal=m;commit()}},
  groupOk(v){const items=pendingObjs().filter(o=>CELLROOM[o.k]===v&&o.label!=='unknown');items.forEach(o=>{o.status=o.label===o.orig?'confirmed':'corrected'});
    tl('you',`You confirmed ${items.length} object${items.length>1?'s':''} in ${ROOM[v]?ROOM[v].the:'the home'}`);if(window.onObjChange)window.onObjChange(items);

    tl('you',`You left ${items.length} object${items.length>1?'s':''} in ${ROOM[v]?ROOM[v].the:'the home'} unchecked for now`);if(window.onObjChange)window.onObjChange(items);
    S.ui.modal=null;flash('Ignored for now. The robot keeps going around them.');commit()},
  recheckObjs(){const items=visibleObjs().filter(o=>o.status==='ignored');if(!items.length)return;items.forEach(o=>{o.status='pending'});if(window.onObjChange)window.onObjChange(items);A.reviewRoom(CELLROOM[items[0].k])},
  fixObj(v){S.ui.objId=v;S.ui.objSel=null;S.ui.objCustom='';S.ui.objQueue=null;S.ui.modal=objModal(v);commit()},
  reviewObjs(){const q=pendingObjs().map(o=>o.id);if(!q.length)return;S.ui.notice=null;S.ui.objQueue=q;S.ui.objId=q[0];S.ui.objSel=null;S.ui.modal=objModal(q[0]);commit()},
  objPick(v){S.ui.objSel=v;S.ui.modal=objModal(S.ui.objId);commit();if(v==='other')setTimeout(()=>{const i=document.getElementById('obj-custom');if(i)i.focus()},60)},
  objSave(){const o=S.objects.find(x=>x.id===S.ui.objId);let sel=S.ui.objSel||o.label;
    if(sel==='other'){const t=(S.ui.objCustom||'').trim();if(!t){const i=document.getElementById('obj-custom');if(i){i.focus();i.placeholder='Type a name first'}return}
      sel='c_'+t.toLowerCase().replace(/[^a-z0-9]+/g,'_');if(!OBJ[sel])OBJ[sel]={n:t.charAt(0).toUpperCase()+t.slice(1),e:'🏷️',custom:true};S.ui.objCustom='';}
    if(sel!==o.label){tl('you',`You corrected: ${OBJ[o.label].n} → ${OBJ[sel].n}`);o.label=sel;o.status='corrected'}
    else{if(o.status!=='auto'||S.ui.objSel)tl('you',`You confirmed: ${OBJ[sel].n}`);o.status=o.status==='auto'?'auto':'confirmed';if(o.orig!==o.label)o.status='corrected'}

  objNone(){const o=S.objects.find(x=>x.id===S.ui.objId);S.objects=S.objects.filter(x=>x!==o);tl('you',`You said nothing was there (robot thought: ${OBJ[o.orig].n.toLowerCase()})`);objNext()},
  map3d(v){S.ui.map3d=v==='1';commit()},
  tab(v){S.ui.tab=v;S.ui.stack=[];commit(true)},
  toNeeds(){const el=document.getElementById('needs-you');if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})},
  go(v){go(v)},back(){back()},
  setup(){go('setup')},
  setupKind(v){S.ui.setup.kind=v;commit()},
  toggleRoom(v){const s=S.ui.setup;if(s.kind!=='rooms')return;s.rooms=s.rooms.includes(v)?s.rooms.filter(x=>x!==v):[...s.rooms,v];commit()},
  setupZone(v){S.ui.setup.zone=v;commit()},
  startTask(){const s=S.ui.setup;command('Start cleaning','Cleaning started',()=>{startTask({...s,rooms:[...s.rooms]});S.ui.stack=[];S.ui.tab='map';forceTop=true})},
  pause(){command('Pause','Paused',()=>{S.device.status='paused';tl('you','You paused cleaning')})},
  resume(){command('Resume','Cleaning resumed',()=>{S.device.status='cleaning';S.device.error=null;S.checkEv=null;S.waitEv=null;tl('you','You resumed cleaning')})},
  endReturn(){
    const left=unfinishedRooms();
    S.ui.modal={title:'End cleaning and return?',body:`<p>${left.length?`Not finished yet: ${esc(left.join(', '))}. They’ll be listed as not cleaned in the report.`:'The robot is almost done. Remaining spots will be listed in the report.'}</p>`,buttons:[{label:'End and return to dock',a:'confirmEnd',cls:'danger'},{label:'Keep cleaning',a:'closeModal'}]};commit()},
  confirmEnd(){S.ui.modal=null;command('End and return','Returning to dock',()=>{S.task.endedEarly=true;tl('you','You ended cleaning early');S.sim.queue=[];S.sim.hold=0;S.device.status='cleaning';finishRun()})},
  openEvent(v){S.ui.notice=null;const c=cur();if(c.name==='event'&&c.id===v)return;go('event',v)},
  openReport(v){go('report',v)},openTimeline(v){go('timeline',v)},
  remember(v,el){S.ui.remember[v]=el.checked},
  evAct(v){
    const [id,act]=v.split('|');const ev=findEvent(id);const d=DEFS[ev.key];
    if(act==='nogo'){S.ui.modal={title:`Never clean ${ZONES[d.zone].name.toLowerCase()}?`,body:'<p>The robot will stay out of it every time. You can undo this in Settings.</p>',buttons:[{label:'Yes, never clean here',a:'evGo',v:id+'|nogo|0',cls:'primary'},{label:'Cancel',a:'closeModal'}]};commit();return}
    if(S.ui.remember[id]&&d.remember&&d.remember[act]){doAction(ev,act,true);return}
    doAction(ev,act,false);
  },
  evGo(v){const [id,act,save]=v.split('|');S.ui.modal=null;doAction(findEvent(id),act,save==='1');commit()},
  snapshot(v){S.ui.modal=snapshotModal(findEvent(v));commit()},
  closeModal(){S.ui.modal=null;S.ui.objQueue=null;S.ui.objSel=null;S.ui.objCustom='';commit()},
  closeModalBg(v,el,e){if(e.target===el){S.ui.modal=null;commit()}},
  cmdRetry(){const r=S.cmd.retry;S.cmd=null;r()},
  cmdRefresh(){S.cmd={label:'Refreshing status',state:'sending'};commit();setTimeout(()=>{S.cmd={label:'Status refreshed',state:'confirmed'};commit();setTimeout(()=>{S.cmd=null;commit()},1500)},700)},
  cmdDismiss(){S.cmd=null;commit()},
  reconnect(){S.conn='connecting';commit();setTimeout(()=>{S.conn='connected';S.snap=null;dirtyAll();S.cmd={label:'Status updated',state:'confirmed'};commit();setTimeout(()=>{if(S.cmd&&S.cmd.state==='confirmed'){S.cmd=null;commit()}},1600)},1300)},
  setAutonomy(v){S.autonomy=v;S.temp=null;levelNotif(v);commit()},
  notif(v){S.notif[v]=!S.notif[v];commit()},
  delRule(v){S.rules=S.rules.filter(r=>r.id!==v);commit()},
  delNogo(v){S.nogo=S.nogo.filter(z=>z!==v);ZONES[v].keys.forEach(k=>{if(S.cells[k]==='nogo')setCell(k,S.task&&!S.task.done?'todo':'out')});commit()},
  toggleSched(v){const s=S.schedules.find(x=>x.id===v);s.on=!s.on;commit()},
  editSched(v){
    const s=v==='new'?{id:'new',time:'10:00',days:['Sat'],scope:'Entire home',on:true}:S.schedules.find(x=>x.id===v);
    S.ui.sched={...s,days:[...s.days]};schedModal();
  },
  schedDay(v){const ti=document.getElementById('sch-time'),sc=document.getElementById('sch-scope');if(ti)S.ui.sched.time=ti.value;if(sc)S.ui.sched.scope=sc.value;const d=S.ui.sched.days;S.ui.sched.days=d.includes(v)?d.filter(x=>x!==v):[...d,v];schedModal()},
  schedSave(){const f=S.ui.sched;const t=document.getElementById('sch-time').value||f.time;const sc=document.getElementById('sch-scope').value;
    const order=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const days=order.filter(d=>f.days.includes(d));if(!days.length)return;
    if(f.id==='new')S.schedules.push({id:'s'+(++seq),time:t,days,scope:sc,on:true});else Object.assign(S.schedules.find(x=>x.id===f.id),{time:t,days,scope:sc});
    S.schedules.sort((a,b)=>a.time.localeCompare(b.time));S.ui.modal=null;commit()},
  schedDelete(){S.schedules=S.schedules.filter(x=>x.id!==S.ui.sched.id);S.ui.modal=null;commit()},
  ob(v){S.onboarding=v;commit()},
  obMode(v){S.ui.obMode=v;commit()},
  obDone(){S.autonomy=S.ui.obMode;levelNotif(S.autonomy);S.onboarding=null;S.ui.tab='home';S.ui.stack=[];commit(true)},
  ctlScen(v){S.ctl.scenario=v;renderPanel()},
  ctlRetry(v){S.ctl.retry=v;renderPanel()},
  ctlSpeed(v){S.ctl.speed=+v;renderPanel()},
  ctlFail(){S.ctl.failNext=!S.ctl.failNext;renderPanel()},
  ctlDisconnect(){S.snap={clock:S.clock,device:{...S.device},pos:{...S.sim.pos},pct:pct()};S.conn='disconnected';commit()},
  ctlStuck(){if(S.device.status!=='cleaning')return;S.device.status='error';S.device.error=`Wheels can’t move after 3 tries to free itself in ${curRoom().the}. Lift it onto open floor, check the wheels, then resume.`;tl('robot','Stuck: wheels can’t move');if(S.notif.problems)banner('stuck',{id:'stuck',title:'Robot is stuck',body:'It tried 3 times to free itself. It needs a hand.'});commit()},
  ctlReset(){const keep={autonomy:S.autonomy,rules:S.rules,nogo:S.nogo,schedules:S.schedules,ctl:S.ctl,history:S.history};S=initState();Object.assign(S,keep);S.onboarding=null;commit(true)},
  ctlRestart(){const ctl=S.ctl;S=initState();S.ctl=ctl;commit(true)},
};
function objNext(){
  const q=S.ui.objQueue;S.ui.objSel=null;S.ui.objCustom='';
  if(q){const i=q.indexOf(S.ui.objId);const nx=q.slice(i+1).find(id=>S.objects.some(o=>o.id===id));if(nx){S.ui.objId=nx;S.ui.modal=objModal(nx);commit();return}}
  S.ui.modal=null;S.ui.objQueue=null;
  if(q){flash('All objects checked. Map updated.')}else commit();
}
function schedModal(){
  const f=S.ui.sched;const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  S.ui.modal={title:f.id==='new'?'New schedule':'Edit schedule',body:`<label class="field"><span>Time</span><input id="sch-time" type="time" value="${f.time}"></label>
  <div class="field"><span>Repeat on</span><div class="chips">${days.map(d=>`<button class="chip ${f.days.includes(d)?'on':''}" data-a="schedDay" data-v="${d}">${d}</button>`).join('')}</div></div>
  <label class="field"><span>What to clean</span><select id="sch-scope">${['Entire home',...ROOMS.map(r=>r.name)].map(o=>`<option ${o===f.scope?'selected':''}>${o}</option>`).join('')}</select></label>${f.days.length?'':'<p class="small" style="color:var(--stop);margin-top:8px">Pick at least one day.</p>'}`,
  buttons:[{label:'Save schedule',a:'schedSave',cls:'primary'}].concat(f.id!=='new'?[{label:'Delete schedule',a:'schedDelete',cls:'danger'}]:[]).concat([{label:'Cancel',a:'closeModal'}])};
  commit();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(el.type==='checkbox')return;
  const f=A[el.dataset.a];if(f){f(el.dataset.v,el,e)}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.objInput!==undefined)S.ui.objCustom=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.objInput!==undefined){e.preventDefault();A.objSave()}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.a==='remember')A.remember(el.dataset.v,el)});

/* ============ random faults ============ */
function maybeFault(){
  const t=S.task;if(!t||t.done||t.fault||t.spot||S.conn!=='connected'||S.device.status!=='cleaning'||S.ui.modal)return;
  t.ticks=(t.ticks||0)+1;if(t.ticks<20||S.sim.hold>0)return;
  const r=Math.random();
  if(r<0.0025){t.fault='disconnect';A.ctlDisconnect()}
  else if(r<0.005){t.fault='stuck';A.ctlStuck()}
}
/* ============ fit phone frame to window (keeps iPhone proportions) ============ */
function fitPhone(){const ph=document.querySelector('.phone');if(!ph)return;ph.style.zoom=window.innerWidth>760?Math.min(1,(window.innerHeight-50)/844).toFixed(3):'1'}
window.addEventListener('resize',fitPhone);fitPhone();
/* ============ loop ============ */
let acc=0,last=performance.now();
setInterval(()=>{
  if(window.HA_LIVE){HA_TICK();return}
  const now=performance.now();acc+=now-last;last=now;
  const stepMs=340/S.ctl.speed;
  while(acc>=stepMs){acc-=stepMs;
    if(S.onboarding)continue;
    S.clock+=6;
    if(S.device.status==='cleaning'){stepClean();maybeFault()}
    else if(S.device.status==='returning')stepReturn();
    else if(S.device.status==='docked'&&S.device.battery<100&&Math.random()<.2)S.device.battery++;
  }
  checkTemp();checkReminders();
  updateLive();
},80);
if(window.HA_LIVE)HA_INIT();else if(window.HA_DEMO_INIT)HA_DEMO_INIT();
commit();
</script>
