<!doctype html>
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; }
body { width: 1600px; height: 985px; overflow: hidden; background: #fdf6fb; position: relative; font-family: Inter, system-ui, sans-serif; }
.glow { position: absolute; inset: -10%; background: radial-gradient(40% 50% at 50% 45%, rgba(244,72,216,.42), transparent 70%), radial-gradient(30% 40% at 82% 80%, rgba(143,99,255,.32), transparent 70%), radial-gradient(30% 40% at 16% 78%, rgba(244,72,216,.2), transparent 70%); filter: blur(30px); }
.row { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; gap: 56px; perspective: 1800px; }
.ph { width: 330px; aspect-ratio: 375/812; border-radius: 40px; overflow: hidden; background: #fff; box-shadow: 0 0 0 8px #fff, 0 0 0 9px rgba(228,44,196,.22), 0 40px 90px -30px rgba(196,33,159,.55); transform: rotateY(-12deg) rotateX(6deg) translateY(var(--y, 40px)); }
.ph img { width: 100%; display: block; transform: translateY(var(--o, 0)); }
.lead { width: 380px; --y: -20px; z-index: 1; }
</style></head><body>
<div class="glow"></div>
<div class="row">
  <div class="ph" style="--o:-18%"><img src="../../assets/projects/vipshop/card-trend.webp"></div>
  <div class="ph lead" style="--o:-17%"><img src="../../assets/projects/vipshop/feed-after-full.webp"></div>
  <div class="ph" style="--o:0"><img src="../../assets/projects/vipshop/pref-sheet.webp"></div>
</div>
</body></html>
