<!doctype html>
<html><head><meta charset="utf-8"><title>Kohler hero scene</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #061315; }
  .bg { position: absolute; inset: 0; background: radial-gradient(60% 75% at 50% 58%, #0f3b3c 0%, #08201f 45%, #040d0e 100%); }
  .glow { position: absolute; left: 50%; top: 56%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%; background: radial-gradient(circle, rgba(63,193,181,.28), rgba(63,193,181,0) 62%); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(0deg, rgba(4,13,14,.95), transparent); }
  .stage { position: absolute; inset: 0; perspective: 2400px; }
  .ph { position: absolute; left: 50%; top: 50%; width: 402px; height: 874px; border-radius: 62px; padding: 13px; background: #0a1719;
        box-shadow: 0 0 0 1.5px rgba(150,230,222,.28), inset 0 0 0 1px rgba(255,255,255,.06), 0 60px 120px -30px rgba(0,0,0,.85), 0 0 140px -40px rgba(63,193,181,.45);
        transform-style: preserve-3d; }
  .scr { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #000507; }
  .scr img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .lay { position: absolute; inset: 0; opacity: 0; }
  .lay img { width: 100%; }
  .main { width: 446px; height: 968px; }
  .side { filter: brightness(.42) saturate(.8); }
  .ring { position: absolute; left: 30px; top: 175px; width: 314px; height: 314px; }
  .ring circle { fill: none; stroke: #f2fbfa; stroke-width: 5; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; filter: drop-shadow(0 0 6px rgba(255,255,255,.7)); }
</style></head>
<body>
<div class="bg"></div><div class="glow"></div>
<div class="stage">
  <div class="ph side" id="L"><div class="scr"><img src="../../assets/projects/kohler/app/s/learn.webp"></div></div>
  <div class="ph side" id="R"><div class="scr"><img src="../../assets/projects/kohler/app/s/rituals.webp"></div></div>
  <div class="ph main" id="M"><div class="scr">
    <div class="lay" id="s0"><img src="../../assets/projects/kohler/app/s/intro1.webp"></div>
    <div class="lay" id="s1"><img id="todayImg" src="../../assets/projects/kohler/app/s/today.webp"><div style="position:absolute;left:0;top:0;width:100%;height:60px;background:url(../../assets/projects/kohler/app/s/today.webp) 0 0/100% auto"></div><img id="todayBar" src="../../assets/projects/kohler/app/s/today.webp" style="top:auto;bottom:0;height:110px;object-fit:cover;object-position:0 100%"></div>
    <div class="lay" id="s2"><img src="../../assets/projects/kohler/app/s/capability.webp"></div>
    <div class="lay" id="s3"><img src="../../assets/projects/kohler/app/s/run1.webp"><svg class="ring" viewBox="0 0 340 340"><circle id="ringC" cx="170" cy="170" r="166" pathLength="1000" stroke-dasharray="0 1000"/></svg></div>
    <div class="lay" id="s4"><img src="../../assets/projects/kohler/app/s/done.webp"></div>
  </div></div>
</div>
<div class="floor"></div>
<script>
// deterministic scene: setT(seconds) draws one frame; the loop is DUR seconds long and returns to the start
const DUR = 14;
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const seg = [[0, 2.6], [2.6, 6.6], [6.6, 9.0], [9.0, 11.8], [11.8, 14]]; // intro, today, capability, ritual, done
const F = 0.55; // crossfade
const sc = 446 / 402; // main phone screen scale vs 402pt design
function setT(t) {
  t = ((t % DUR) + DUR) % DUR;
  const ph = (t / DUR) * Math.PI * 2;
  // gentle float and tilt, all periodic over the loop
  const M = document.getElementById("M");
  M.style.transform = `translate(-50%, -50%) translateY(${Math.sin(ph) * 10 + 30}px) rotateY(${Math.sin(ph) * 7}deg) rotateX(${2 + Math.cos(ph) * 2}deg)`;
  const L = document.getElementById("L"), R = document.getElementById("R");
  L.style.transform = `translate(-50%, -50%) translate(-470px, ${70 + Math.sin(ph + 1.3) * 14}px) translateZ(-420px) rotateY(18deg) scale(.92)`;
  R.style.transform = `translate(-50%, -50%) translate(470px, ${70 + Math.sin(ph + 2.4) * 14}px) translateZ(-420px) rotateY(-18deg) scale(.92)`;
  // screens: fade between, wrapping done -> intro
  seg.forEach(([a, b], i) => {
    let o = ease((t - a) / F) * (1 - ease((t - b) / F));
    if (i === 0) o = Math.max(o, ease((t - (DUR - F)) / F)); // intro fades back in at the end
    if (i === 4) o = ease((t - a) / F) * (1 - ease((t - (DUR - F)) / F));
    document.getElementById("s" + i).style.opacity = o;
  });
  // Today scrolls slowly
  const k = ease((t - 3.1) / 3.2);
  document.getElementById("todayImg").style.transform = `translateY(${-k * 560 * sc}px)`;
  // the ritual ring sweeps
  const r = ease((t - 9.2) / 2.5);
  document.getElementById("ringC").setAttribute("stroke-dasharray", `${(r * 1000).toFixed(1)} 1000`);
}
const ringBox = document.querySelector(".ring"); ringBox.style.cssText = `left:${31 * sc}px;top:${177 * sc}px;width:${340 * sc}px;height:${340 * sc}px`;
setT(0);
</script>
</body></html>
