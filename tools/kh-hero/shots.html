<!doctype html>
<html><head><meta charset="utf-8"><title>Kohler hero shots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #030a0b; font-family: Inter, system-ui, sans-serif; }
  .bg { position: absolute; inset: 0; background: radial-gradient(55% 70% at var(--gx, 70%) 55%, #0e3536 0%, #061718 45%, #020708 100%); }
  .stage { position: absolute; inset: 0; perspective: 2200px; }
  .ph { position: absolute; left: 0; top: 0; width: 402px; height: 874px; border-radius: 64px; padding: 11px; transform-origin: 50% 50%;
        background: linear-gradient(140deg, #3a4648 0%, #0d1416 18%, #050909 50%, #1c2628 82%, #46585a 100%);
        box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 80px 160px -40px rgba(0,0,0,.9); transform-style: preserve-3d; }
  .scr { position: relative; width: 100%; height: 100%; border-radius: 54px; overflow: hidden; background: #000507; }
  .scr img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .glare { position: absolute; inset: 0; border-radius: 54px; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.10) 45%, rgba(255,255,255,.02) 52%, transparent 60%); background-size: 300% 100%; }
  .ring { position: absolute; }
  .ring circle { fill: none; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .type { position: absolute; color: #eaf6f4; font-weight: 300; font-size: 76px; letter-spacing: -0.035em; line-height: 1.05; }
  .type small { display: block; margin-top: 22px; font-size: 20px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: #5fd6ca; }
  .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(80% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .grain { position: absolute; inset: -50%; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body>
<div class="bg"></div>
<div class="stage" id="stage"></div>
<div class="type" id="type"></div>
<div class="vig"></div><div class="grain" id="grain"></div>
<script>
const shot = new URLSearchParams(location.search).get("s") || "A";
const IMG = (n) => `../../assets/projects/kohler/app/s/${n}.webp`;
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const lerp = (a, b, k) => a + (b - a) * k;
const stage = document.getElementById("stage"), type = document.getElementById("type");
const ph = document.createElement("div"); ph.className = "ph";
const scr = document.createElement("div"); scr.className = "scr"; ph.append(scr); stage.append(ph);
const k = 380 / 402; // screen inside the 11px bezel
const S = {
  A: { img: "today", text: "Your day, read.<small>From your wearable</small>", tx: [330, 360], gx: "68%", dur: 3.8 },
  B: { img: "capability", text: "A ritual,<br>composed.<small>From what you own</small>", tx: [1080, 380], gx: "32%", dur: 3.6 },
  C: { img: "run1", text: "The space,<br>prepared.<small>Before you step in</small>", tx: [330, 380], gx: "62%", dur: 3.8 },
}[shot];
document.querySelector(".bg").style.setProperty("--gx", S.gx);
const img = document.createElement("img"); img.src = IMG(S.img); scr.append(img);
if (shot === "A") { const top = document.createElement("div"); top.style.cssText = `position:absolute;left:0;top:0;width:100%;height:${56 * k}px;background:url(${IMG("today")}) 0 0/100% auto;z-index:2`; scr.append(top); }
let ringC = null;
if (shot === "C") {
  scr.insertAdjacentHTML("beforeend", `<svg class="ring" style="left:${30.5 * k}px;top:${177.6 * k}px;width:${340 * k}px;height:${340 * k}px" viewBox="0 0 340 340"><circle cx="170" cy="170" r="166.5" style="stroke:#19333f;stroke-width:7"/><circle id="rc" cx="170" cy="170" r="166.5" style="stroke:#f2fbfa;stroke-width:5.5;filter:drop-shadow(0 0 7px rgba(255,255,255,.8))" pathLength="1000" stroke-dasharray="0 1000"/></svg>`);
  ringC = document.getElementById("rc");
}
const glare = document.createElement("div"); glare.className = "glare"; scr.append(glare);
type.innerHTML = S.text; type.style.left = S.tx[0] + "px"; type.style.top = S.tx[1] + "px";
function setT(t) {
  const p = t / S.dur, e = ease(p);
  let x, y, sc, ry, rx, rz;
  if (shot === "A") { sc = lerp(1.62, 1.74, e); x = lerp(1180, 1150, e); y = lerp(560, 520, e); ry = lerp(-24, -16, e); rx = 6; rz = 0; img.style.transform = `translateY(${-lerp(0, 120, ease((t - .6) / 3)) * k}px)`; }
  if (shot === "B") { sc = lerp(1.7, 1.82, e); x = lerp(640, 660, e); y = lerp(600, 560, e); ry = lerp(22, 15, e); rx = 5; rz = 0; img.style.transform = `translateY(${-lerp(0, 330, ease((t - .3) / 3.2)) * k}px)`; }
  if (shot === "C") { sc = lerp(2.5, 2.7, e); x = lerp(1250, 1230, e); y = lerp(1060, 1030, e); ry = lerp(-14, -9, e); rx = 4; rz = 0;
    ringC.setAttribute("stroke-dasharray", `${(ease((t - .4) / 3.2) * 1000).toFixed(1)} 1000`); }
  ph.style.transform = `translate(${x - 201}px, ${y - 437}px) scale(${sc}) rotateY(${ry}deg) rotateX(${rx}deg) rotateZ(${rz}deg)`;
  glare.style.backgroundPosition = `${lerp(110, -10, e)}% 0`;
  // type rises in, letter-spacing relaxes
  const a = ease((t - .35) / .9);
  type.style.opacity = a; type.style.transform = `translateY(${(1 - a) * 26}px)`; type.style.filter = `blur(${(1 - a) * 8}px)`;
  document.getElementById("grain").style.transform = `translate(${(t * 977) % 120 - 60}px, ${(t * 613) % 120 - 60}px)`;
}
setT(0);
</script>
</body></html>
